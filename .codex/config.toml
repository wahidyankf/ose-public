[mcp_servers.nx-mcp]
command = "npx"
args = [ "nx-mcp@latest", "--minimal" ]

[features]
default_mode_request_user_input = true
multi_agent = true

[agents.ci-monitor-subagent]
description = "CI helper for /monitor-ci. Fetches CI status, retrieves fix details, or updates self-healing fixes. Executes one MCP tool call and returns the result."
config_file = "ci-monitor-subagent.toml"

# Agent registrations below are maintained by hand. Each must name an agent file RHINO generates under
# .codex/agents/ (`./rhino harness adapters generate`); register nothing else here.

[agents.plan-checker]
description = "Validates project plan quality including requirements completeness, technical documentation clarity, and delivery checklist executability. Use when reviewing plans before execution."
config_file = "agents/plan-checker.toml"

[agents.plan-execution-checker]
description = "Validates completed plan implementation by verifying all requirements met, code quality standards followed, and acceptance criteria satisfied. Final quality gate before marking plan complete."
config_file = "agents/plan-execution-checker.toml"

[agents.plan-maker]
description = "Creates project plans with requirements, technical documentation, and delivery checklists. Returns unresolved pre-write and post-write decisions to the calling root orchestrator for grilling, then resumes with resolved answers. Structures plans for systematic execution via the plan-execution workflow (orchestrated by the calling context)."
config_file = "agents/plan-maker.toml"
