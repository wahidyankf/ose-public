name: "Setup Go"
description: "Install the pinned Go toolchain, with a pinned golangci-lint and shfmt"
inputs:
  go-version:
    description: "Go toolchain version; stays equal to the `go` directive of apps/ayokoding-cli/go.mod"
    required: false
    default: "1.26.1"
  cache-dependency-path:
    description: "go.sum used as the module-cache key; empty leaves the setup-go cache off"
    required: false
    default: "apps/ayokoding-cli/go.sum"
  golangci-lint-version:
    description: "golangci-lint version used by the Go quality job"
    required: false
    default: "v2.11.3"
  shfmt-version:
    description: "shfmt version used by the declared shell formatter"
    required: false
    default: "v3.13.1"
runs:
  using: "composite"
  steps:
    # The toolchain version is a literal input default. Keep it equal to the `go` directive of
    # apps/ayokoding-cli/go.mod, so the toolchain CI installs and the toolchain `go build`
    # demands cannot drift apart.
    # setup-go owns both the module cache (~/go/pkg/mod) and the build cache (~/.cache/go-build);
    # no second cache action touches them. Its cache is keyed on a dependency file, so caching is
    # on only when a `cache-dependency-path` is supplied.
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.cache-dependency-path != '' }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    # Installed through the module proxy rather than the upstream `install.sh`: the proxy path is
    # checksum-verified against GOSUMDB, whereas the shell installer is fetched from an unpinned
    # `HEAD` ref and piped straight into a shell. `@v2` is part of the module path, not a version
    # selector -- golangci-lint 2.x publishes under a /v2 major-version suffix.
    #
    # The `command -v` guard mirrors setup-rust's cargo-install steps: a self-hosted runner keeps
    # $GOPATH/bin between jobs, so a reinstall would only cost time. The version is asserted after
    # the guard, so a runner holding a *different* pinned version is corrected rather than silently
    # reused -- 2.x cannot read a 1.x config and vice versa.
    - name: Install golangci-lint
      shell: bash
      env:
        WANT: ${{ inputs.golangci-lint-version }}
      run: |
        set -euo pipefail
        gobin="$(go env GOPATH)/bin"
        echo "$gobin" >> "$GITHUB_PATH"
        want="${WANT#v}"
        have=""
        if [ -x "$gobin/golangci-lint" ]; then
          have="$("$gobin/golangci-lint" --version 2>/dev/null | sed -n 's/.*version \([0-9][^ ]*\).*/\1/p')"
        fi
        if [ "$have" != "$want" ]; then
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${want}"
        fi
        "$gobin/golangci-lint" --version

    # `scripts/format-staged` invokes shfmt for any changed shell file. The
    # GitHub-hosted Ubuntu image does not provide it, so install the declared
    # formatter through Go's checksum-verified module proxy rather than relying
    # on an image-specific package.
    - name: Install shfmt
      shell: bash
      env:
        WANT: ${{ inputs.shfmt-version }}
      run: |
        set -euo pipefail
        gobin="$(go env GOPATH)/bin"
        echo "$gobin" >> "$GITHUB_PATH"
        want="${WANT#v}"
        have=""
        if [ -x "$gobin/shfmt" ]; then
          have="$("$gobin/shfmt" --version 2>/dev/null | sed -n '1{s/^v//;p;}')"
        fi
        if [ "$have" != "$want" ]; then
          go install "mvdan.cc/sh/v3/cmd/shfmt@v${want}"
        fi
        "$gobin/shfmt" --version
