name: _reusable-ayokoding-www-examples-check

on:
  workflow_call:
    inputs:
      selection:
        description: "since runs the affected selection; all runs every opted-in course"
        required: true
        type: string
      base:
        description: "revision the since selection diffs against; empty for the all selection"
        required: false
        default: ""
        type: string
      shards:
        description: "JSON array of shard numbers to run"
        required: true
        type: string
      shard-total:
        description: "total shard count; each shard runs as K/N against it"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Examples check (shard ${{ matrix.shard }} of ${{ inputs.shard-total }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.selection == 'all' && 300 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-docker-cache
      - name: Build the CLI
        run: >-
          ./hippo run --class ephemeral --resource-tier heavy --disk-path . --
          npx nx run ayokoding-cli:build
      # The ayokoding-toolchain/* images live in no registry: each shard job
      # builds them into the local store from the repo Dockerfiles, so the
      # check never pulls them. Building all sixteen images per shard exhausts
      # the runner disk, so each shard builds only the toolchains its own
      # course selection declares in run specs. Only entries still naming the
      # local namespace are built; pinned public images keep flowing through
      # `docker pull`.
      - name: Build the toolchain images locally
        env:
          AYOKODING_BUILDX_CACHE: /tmp/.buildx-cache
        run: |
          set -euo pipefail
          if [ "${{ inputs.selection }}" = "all" ]; then
            sel=(--all)
          else
            sel=(--since "${{ inputs.base }}")
          fi
          affected_json=$(mktemp)
          apps/ayokoding-cli/dist/ayokoding-cli examples affected "${sel[@]}" \
            --shard "${{ matrix.shard }}/${{ inputs.shard-total }}" --output json >"$affected_json" \
            || { echo "course selection failed" >&2; exit 1; }
          mapfile -t courses < <(jq -r '.courses[]' "$affected_json")
          rm -f "$affected_json"
          wanted=$(for c in "${courses[@]}"; do
            dir="apps/ayokoding-www/content/en/learn/courses/$c"
            [ -d "$dir" ] || { echo "unknown course dir for slug: $c" >&2; exit 1; }
            grep -rhoE "^toolchain: [A-Za-z0-9_.+-]+" "$dir" --include=run.yaml
          done | awk '{print $2}' | sort -u)
          mapfile -t ids < <(apps/ayokoding-cli/dist/ayokoding-cli toolchains list --output json \
            | jq -r --argjson wanted "$(printf '%s\n' "$wanted" | jq -R . | jq -cs .)" \
              '.toolchains[] | select(.image | startswith("ayokoding-toolchain/")) | select(.id as $id | $wanted | index($id)) | .id')
          if [ "${#ids[@]}" -eq 0 ]; then
            echo "no local toolchain images needed for this shard"
          else
            ./hippo run --class ephemeral --resource-tier heavy --disk-path . -- \
              apps/ayokoding-cli/dist/ayokoding-cli toolchains build "${ids[@]}"
          fi
      - name: Run the examples check
        env:
          AYOKODING_SHARD: ${{ matrix.shard }}/${{ inputs.shard-total }}
          AYOKODING_BUILDX_CACHE: /tmp/.buildx-cache
          NX_BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          args=(run ayokoding-www:examples:check)
          if [ "${{ inputs.selection }}" = "all" ]; then
            args+=(--configuration=full)
          fi
          ./hippo run --class ephemeral --resource-tier heavy --disk-path . -- npx nx "${args[@]}"
      # The CLI writes fresh buildx layers to a -new sibling of the cache folder, because
      # cache-to cannot write to the folder cache-from reads. Promote it so the cache
      # action saves the fresh layers; skip when nothing ran and no -new folder exists.
      - name: Rotate the buildx cache folder
        run: |
          set -euo pipefail
          if [ -d /tmp/.buildx-cache-new ]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi
      - name: Append the coverage report to the summary
        run: apps/ayokoding-cli/dist/ayokoding-cli examples coverage >> "$GITHUB_STEP_SUMMARY"
