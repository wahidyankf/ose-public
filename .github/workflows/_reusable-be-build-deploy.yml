name: _reusable-be-build-deploy

# Reusable backend container build+publish. Builds the be image and pushes it to
# GHCR (:latest + :${sha}). Rolling the pushed image out is outside this repository's scope.

on:
  workflow_call:
    inputs:
      be-project:
        required: true
        type: string
      image-name:
        required: true
        type: string
      environment:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-deploy:
    name: Build and push ${{ inputs.be-project }} image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-podman
      - name: Generate OpenAPI contract types
        run: npx nx run ${{ inputs.be-project }}:codegen
      - name: Log in to GHCR with an ephemeral auth file
        env:
          REGISTRY_ACTOR: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          auth_file="${RUNNER_TEMP}/ghcr-auth.json"
          printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io --username "$REGISTRY_ACTOR" --password-stdin --authfile "$auth_file"
      - name: Build and push ${{ inputs.be-project }}
        run: |
          set -euo pipefail
          auth_file="${RUNNER_TEMP}/ghcr-auth.json"
          podman build --layers --format docker -f apps/${{ inputs.be-project }}/Dockerfile \
            -t ${{ inputs.image-name }}:latest \
            -t ${{ inputs.image-name }}:${{ github.sha }} \
            .
          podman push --authfile "$auth_file" ${{ inputs.image-name }}:latest
          podman push --authfile "$auth_file" ${{ inputs.image-name }}:${{ github.sha }}
      - name: Remove the ephemeral registry auth file
        if: always()
        run: rm -f "${RUNNER_TEMP}/ghcr-auth.json"
