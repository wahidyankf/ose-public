name: _reusable-be-build-deploy

# Reusable backend container build+publish. Builds the be image and pushes it to
# GHCR (:latest + :${sha}). The k3s rollout is orchestrated by the private sibling
# coralpolyp, which consumes the pushed image — out of scope for this repo.

on:
  workflow_call:
    inputs:
      be-project:
        required: true
        type: string
      image-name:
        required: true
        type: string
      environment:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-deploy:
    name: Build and push ${{ inputs.be-project }} image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - name: Generate OpenAPI contract types
        run: npx nx run ${{ inputs.be-project }}:codegen
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ inputs.be-project }}
        run: |
          docker build -f apps/${{ inputs.be-project }}/Dockerfile \
            -t ${{ inputs.image-name }}:latest \
            -t ${{ inputs.image-name }}:${{ github.sha }} \
            .
          docker push ${{ inputs.image-name }}:latest
          docker push ${{ inputs.image-name }}:${{ github.sha }}
