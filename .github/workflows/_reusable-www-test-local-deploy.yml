name: _reusable-www-test-local-deploy

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
      prod-branch:
        required: true
        type: string
      health-url:
        required: false
        type: string
        default: ""
      health-timeout:
        required: false
        type: number
        default: 120
      copy-prerender-manifest-for-e2e:
        required: false
        type: boolean
        default: false
permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npx nx run ${{ inputs.app-name }}:lint

  unit:
    name: Quick gate (Unit + static coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npx nx run ${{ inputs.app-name }}:test:quick

  specs-coverage:
    name: Static behaviour coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - name: Validate app and E2E behaviour coverage without running tests
        run: |
          npx nx run ${{ inputs.app-name }}:test:coverage
          be_project="${{ inputs.app-name }}-be-e2e"
          if npx nx show project "$be_project" --json > /dev/null 2>&1; then
            npx nx run "${be_project}:test:coverage"
          fi
          npx nx run ${{ inputs.app-name }}-fe-e2e:test:coverage

  integration:
    name: Integration tests
    needs: [unit, specs-coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - name: Run the app Integration target when the project owns one
        run: npx nx run-many -t test:integration --projects=${{ inputs.app-name }}

  e2e:
    name: E2E tests
    needs: [unit, specs-coverage, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-docker-cache
      - uses: ./.github/actions/setup-playwright
      # Start via Docker
      - run: docker compose -f infra/dev/${{ inputs.app-name }}/docker-compose.yml up --build -d
      # Wait for health
      - run: |
          HEALTH_URL="${{ inputs.health-url }}"
          if [ -z "$HEALTH_URL" ]; then
            HEALTH_URL="http://localhost:3100"
          fi
          for _ in $(seq 1 $(( ${{ inputs.health-timeout }} / 5 ))); do
            if curl -s "$HEALTH_URL" > /dev/null 2>&1; then break; fi
            sleep 5
          done
      - name: Copy prerender manifest for E2E
        if: inputs.copy-prerender-manifest-for-e2e
        run: |
          artifact_dir="apps/${{ inputs.app-name }}-fe-e2e/.e2e-artifacts"
          container_id="$(docker compose -f infra/dev/${{ inputs.app-name }}/docker-compose.yml ps -q "${{ inputs.app-name }}")"
          test -n "$container_id"
          mkdir -p "$artifact_dir"
          docker cp "$container_id:/app/apps/${{ inputs.app-name }}/.next/prerender-manifest.json" "$artifact_dir/prerender-manifest.json"
      # Run E2E
      - run: |
          be_project="${{ inputs.app-name }}-be-e2e"
          if npx nx show project "$be_project" --json > /dev/null 2>&1; then
            npx nx run "${be_project}:test:e2e"
          fi
          npx nx run ${{ inputs.app-name }}-fe-e2e:test:e2e
      - if: always()
        run: docker compose -f infra/dev/${{ inputs.app-name }}/docker-compose.yml down -v

  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.check.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: check
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- "apps/${{ inputs.app-name }}/" 2>/dev/null || echo "")
          if [ -n "$CHANGED" ]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to production
    needs: [lint, unit, specs-coverage, e2e, detect-changes]
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: |
          git push origin HEAD:${{ inputs.prod-branch }} --force
