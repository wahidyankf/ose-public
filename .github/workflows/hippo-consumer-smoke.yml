name: HIPPO Consumer Smoke

on:
  # A Linux-only retention defect once reached main through a green pull request
  # because this suite ran on no pull-request surface at all. The path filter
  # keeps unrelated pull requests free of the job while every change to the
  # consumer boundary is proved on both operating systems before it merges.
  pull_request:
    paths:
      - hippo
      - hippo.lock
      - hippo.identity.json
      - hippo.local.json.example
      - .github/scripts/test-hippo-bootstrap.sh
      - .github/scripts/test-hippo-consumer.sh
      - .github/workflows/hippo-consumer-smoke.yml
      # The consumer contract asserts against these two files, so a change to
      # either can break it while touching nothing in the list above. One did.
      - .github/workflows/pr-quality-gate.yml
      - .github/actions/setup-go/action.yml
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hippo-consumer-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  consumer:
    name: Consumer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js without workspace installation
        uses: ./.github/actions/setup-node
        with:
          run-npm-ci: "false"

      - name: Set up .NET for Rhino config validation
        uses: ./.github/actions/setup-dotnet

      - name: Verify the hermetic consumer contract
        run: ./.github/scripts/test-hippo-consumer.sh

      - name: Install and identify the pinned release
        env:
          HIPPO_INSTALL_CACHE: ${{ runner.temp }}/hippo-cache
        run: ./hippo version --json

      - name: Verify configured status schema
        env:
          HIPPO_CONFIG: ${{ github.workspace }}/hippo.local.json.example
          HIPPO_INSTALL_CACHE: ${{ runner.temp }}/hippo-cache
          HIPPO_ROOT: ${{ runner.temp }}/hippo-state
        run: |
          ./hippo status --json --disk-path . > "${RUNNER_TEMP}/hippo-status.json"
          node -e '
          const value = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/hippo-status.json", "utf8"));
          const problems = [];
          if (value.schemaVersion !== 5) problems.push("status schemaVersion " + value.schemaVersion);
          if (!value.configHash) problems.push("missing configHash");
          const profile = value.profile ?? {};
          // resolvedProfile is pressure-dependent by design: the built-in balanced profile is not
          // strict and falls back through constrained and minimal, so a busy runner legitimately
          // resolves to a fallback instead. Pin the config-derived request, and require only that
          // the outcome stays on its declared chain.
          if (profile.requestedProfile !== "balanced") problems.push("requestedProfile " + profile.requestedProfile);
          if (!Array.isArray(profile.fallbackChain) || !profile.fallbackChain.includes(profile.resolvedProfile)) problems.push("resolvedProfile " + profile.resolvedProfile + " is outside its declared chain " + JSON.stringify(profile.fallbackChain));
          const coordination = value.coordination ?? {};
          if (coordination.mode !== "reservation") problems.push("coordination mode " + coordination.mode);
          if (coordination.schemaVersion !== 5) problems.push("coordination schemaVersion " + coordination.schemaVersion);
          for (const field of ["capacity", "allocated", "waiting"]) {
            const vector = coordination[field];
            if (typeof vector?.cpu !== "number" || typeof vector?.memoryBytes !== "number") problems.push(field + " vector " + JSON.stringify(vector));
          }
          if (problems.length) { console.error("hippo status contract violated: " + problems.join("; ")); process.exit(1); }
          '

      - name: Verify shared root and OSE worker mappings
        env:
          HIPPO_CONFIG: ${{ github.workspace }}/hippo.local.json.example
          HIPPO_INSTALL_CACHE: ${{ runner.temp }}/hippo-cache
          HIPPO_ROOT: ${{ runner.temp }}/hippo-state
        run: |
          # The light tier's deadline bounds only HIPPO's reservation queue. After it, host-pressure
          # admission samples for a fixed 16-second window, so a briefly loaded runner can defer the
          # run (124, hippo.limit.capacity-deferred) seconds in, with a never-started receipt. HIPPO's
          # contract makes one requeue per such receipt safe, and this payload is an idempotent env
          # assertion, so requeue it, at most three attempts in all. Anything else fails as it came.
          new_never_started_receipt() {
            local path
            for path in "$HIPPO_ROOT"/receipts/*.json; do
              [ -f "$path" ] || continue
              printf '%s\n' "$1" | grep -qxF "${path##*/}" && continue
              grep -q '"state":"never-started"' "$path" && return 0
            done
            return 1
          }
          requeue_never_started() {
            local attempt before status
            for attempt in 1 2 3; do
              before=$(ls "$HIPPO_ROOT/receipts" 2>/dev/null || true)
              status=0
              "$@" 2>"$RUNNER_TEMP/hippo-stderr" || status=$?
              cat "$RUNNER_TEMP/hippo-stderr" >&2
              if [ "$status" -ne 124 ] ||
                ! grep -q '^hippo: \[hippo.limit.capacity-deferred\]' "$RUNNER_TEMP/hippo-stderr" ||
                ! new_never_started_receipt "$before"; then
                return "$status"
              fi
              echo "HIPPO deferred attempt $attempt of 3 before launch with a never-started receipt"
            done
            return 124
          }
          assertion="test \"\$NX_PARALLEL\" = \"\$HIPPO_CONCURRENCY\" && test \"\$DOTNET_PROCESSOR_COUNT\" = \"\$HIPPO_CONCURRENCY\" && test \"\$HIPPO_ROOT\" = \"\$EXPECTED_HIPPO_ROOT\""
          EXPECTED_HIPPO_ROOT="$HIPPO_ROOT" requeue_never_started ./hippo run --class ephemeral --resource-tier light --disk-path . -- sh -c "$assertion"
          EXPECTED_HIPPO_ROOT="$HIPPO_ROOT" requeue_never_started ./hippo run --class ephemeral --resource-tier light --cwd docs --disk-path docs -- sh -c "$assertion"
