name: non-product-full-quality

run-name: non-product-full-quality-${{ inputs.evidence_nonce || 'scheduled' }}

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      evidence_nonce:
        description: "Unique token that names this manual run, so its evidence is findable"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: non-product-full-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-and-static:
    name: Unit and static behaviour coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-python
      - name: Install locked Python dependencies
        run: >-
          npx nx run-many -t install
          --projects=ferret-cli,ferret-cli-e2e
          --parallel=1
      - name: Run complete non-product quick gates serially
        run: >-
          npx nx run-many -t test:quick
          --projects=crane-cli,fsharp-crane-core,fsharp-env-loader,ts-env-loader,web-ui,web-ui-token,ferret-cli,ferret-cli-e2e,ayokoding-cli
          --parallel=1

  integration:
    name: Complete local-resource Integration suites
    needs: unit-and-static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-python
      - name: Install locked Python dependencies
        run: >-
          npx nx run-many -t install
          --projects=ferret-cli
          --parallel=1
      - name: Run every applicable non-product Integration target
        run: >-
          npx nx run-many -t test:integration
          --projects=fsharp-crane-core,fsharp-env-loader,ts-env-loader,ferret-cli,ayokoding-cli
          --parallel=1

  e2e:
    name: Complete public-boundary E2E suites
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-playwright
      - uses: ./.github/actions/setup-python
      - name: Install locked Python dependencies
        run: >-
          npx nx run-many -t install
          --projects=ferret-cli,ferret-cli-e2e
          --parallel=1
      - name: Run every applicable non-product E2E target
        run: >-
          npx nx run-many -t test:e2e
          --projects=crane-cli,ts-env-loader,web-ui,ferret-cli-e2e,ayokoding-cli
          --parallel=1

  # TEMPORARY docker-to-podman proof job: remove after the proof run
  # Test-only manual proof for original rows 26, 33 and the web-UI E2E extra. Not a deploy job.
  # Rows 14 and 20 passed in run 40667489060 and are not re-run here.
  docker-to-podman-ayo-proof:
    name: docker-to-podman-ayo-proof
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NX_SKIP_NX_CACHE: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-podman
      - uses: ./.github/actions/setup-playwright
      - name: Record proof provenance
        run: |
          {
            echo "### docker-to-podman proof provenance"
            echo ""
            echo "- Commit: $(git rev-parse HEAD)"
            . /etc/os-release
            echo "- Runner tuple: ${ID}/${VERSION_CODENAME}/$(dpkg --print-architecture)"
            echo "- Podman: $(podman --version)"
            echo "- Rootless: $(podman info --format '{{.Host.Security.Rootless}}')"
            echo "- podman-compose: $(podman-compose --version)"
            echo "- nproc: $(nproc)"
            echo "- Free memory: $(free -h | awk '/^Mem:/ { print $7 " available of " $2 " total" }')"
          } >> "$GITHUB_STEP_SUMMARY"
      # The stack is built first on a fresh runner, as the reusable e2e job does. The build context must not contain
      # prior build output (such as .next or nx caches). That is why the nx build and integration steps (rows 14 and 20)
      # are not in this job: in run 40667489060 the image build ran out of runner disk after those steps.
      - name: Measure runner disk before the Ayo stack start (diagnostic only)
        run: df -h /
      # Stack steps below mirror the e2e job of _reusable-www-test-local-deploy.yml with the ayokoding-www inputs.
      - name: Start the Ayo Compose stack with Podman Compose
        run: podman compose -f infra/dev/ayokoding-www/docker-compose.yml up --build --detach --wait --wait-timeout 150
      - name: Wait for Ayo health
        run: |
          HEALTH_URL="http://localhost:3101/api/trpc/meta.health"
          for _ in $(seq 1 $(( 150 / 5 ))); do
            if curl -s "$HEALTH_URL" > /dev/null 2>&1; then break; fi
            sleep 5
          done
      - name: Verify the Podman service is running and healthy
        run: |
          set -euo pipefail
          container_id="$(podman ps -q --filter "label=io.podman.compose.project=ayokoding-www" --filter "label=com.docker.compose.service=ayokoding-www")"
          test -n "$container_id"
          state="$(podman inspect --format '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container_id")"
          test "$state" = "running healthy"
      - name: Measure runner disk after the Ayo stack is healthy (diagnostic only)
        run: df -h /
      - name: Copy prerender manifest for E2E
        run: |
          set -euo pipefail
          artifact_dir="apps/ayokoding-www-fe-e2e/.e2e-artifacts"
          container_id="$(podman ps -q --filter "label=io.podman.compose.project=ayokoding-www" --filter "label=com.docker.compose.service=ayokoding-www")"
          test -n "$container_id"
          mkdir -p "$artifact_dir"
          podman cp "$container_id:/app/apps/ayokoding-www/.next/prerender-manifest.json" "$artifact_dir/prerender-manifest.json"
      # E2E_FULL_MATRIX=1 is an explicit opt-in knob, not a CI-state change: CI stays GitHub's CI=true. The BE Playwright
      # config then runs as the local original run did (zero retries, no CI-only worker cap).
      - name: Run the Ayo BE E2E suite (original row 26)
        env:
          E2E_FULL_MATRIX: "1"
        run: npx nx run ayokoding-www-be-e2e:test:e2e
      - name: Stop Ayo containers before FE E2E
        run: podman compose -f infra/dev/ayokoding-www/docker-compose.yml down
      # E2E_FULL_MATRIX=1 is an explicit opt-in knob, not a CI-state change: CI stays GitHub's CI=true. The FE Playwright
      # config then keeps all three browser projects and zero retries, as the local original run did. Without the knob,
      # CI=true selects Chromium only with two retries.
      - name: Run the Ayo FE E2E suite (original row 33)
        env:
          E2E_FULL_MATRIX: "1"
        run: npx nx run ayokoding-www-fe-e2e:test:e2e
      # TEMPORARY diagnostic: keep the failing run's traces, screenshots and videos for the row 33 flake
      - name: Upload the Ayo FE E2E test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ayokoding-www-fe-e2e-test-results
          path: apps/ayokoding-www-fe-e2e/test-results/
          retention-days: 3
          if-no-files-found: ignore
      - name: Stop Ayo containers
        if: always()
        run: podman compose -f infra/dev/ayokoding-www/docker-compose.yml down
      - name: Run the web-UI full E2E extra
        if: always()
        run: npx nx run web-ui:test:e2e
  # END TEMPORARY
