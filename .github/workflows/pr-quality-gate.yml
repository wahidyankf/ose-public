name: pr-quality-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}
  NX_HEAD: ${{ github.sha }}

jobs:
  detect:
    name: Detect affected languages
    runs-on: ubuntu-latest
    outputs:
      has-ts: ${{ steps.detect.outputs.has-ts }}
      has-dotnet-projects: ${{ steps.detect.outputs.has-dotnet-projects }}
      has-dart: ${{ steps.detect.outputs.has-dart }}
      has-java: ${{ steps.detect.outputs.has-java }}
      has-go: ${{ steps.detect.outputs.has-go }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "has-ts=false"
            echo "has-dotnet-projects=false"
            echo "has-dart=false"
            echo "has-java=false"
            echo "has-go=false"
          } >> "$GITHUB_OUTPUT"

          affected=$(npx nx show projects --affected)
          for project in $affected; do
            tags=$(npx nx show project "$project" --json | jq -r '.tags[]?')
            for tag in $tags; do
              case "$tag" in
                lang:ts) echo "has-ts=true" >> "$GITHUB_OUTPUT" ;;
                lang:fsharp | lang:csharp) echo "has-dotnet-projects=true" >> "$GITHUB_OUTPUT" ;;
                lang:dart) echo "has-dart=true" >> "$GITHUB_OUTPUT" ;;
                lang:java) echo "has-java=true" >> "$GITHUB_OUTPUT" ;;
                lang:go) echo "has-go=true" >> "$GITHUB_OUTPUT" ;;
              esac
            done
          done

  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/setup-rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-go
      - name: Verify the declared lifecycle surface
        env:
          RHINO_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          RHINO_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          OSE_GATE_SURFACE: ci
        run: |
          set -euo pipefail
          PATH="node_modules/.bin:$PATH" ./hippo run --class ephemeral --resource-tier standard --disk-path . -- \
            ./rhino gate run --surface pull-request --base "$RHINO_BASE" --head "$RHINO_HEAD"

  typescript:
    name: TypeScript quality gate
    needs: detect
    if: needs.detect.outputs.has-ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - run: >-
          ./hippo run --class ephemeral --resource-tier heavy --disk-path . --
          npx nx affected -t typecheck,lint,test:quick,compat:min-version
          --exclude='tag:lang:fsharp,tag:lang:csharp,tag:lang:rust,tag:lang:dart,tag:lang:java,tag:lang:go'
          --parallel=2

  dotnet:
    name: .NET quality gate
    needs: detect
    if: needs.detect.outputs.has-dotnet-projects == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-dotnet
      - run: >-
          ./hippo run --class transactional --resource-tier standard --disk-path . --
          npx nx affected -t install
          --exclude='tag:lang:ts,tag:lang:dart,tag:lang:java,tag:lang:go'
          --parallel=1
      - run: >-
          ./hippo run --class ephemeral --resource-tier heavy --disk-path . --
          npx nx affected -t typecheck,lint,test:quick,compat:min-version
          --exclude='tag:lang:ts,tag:lang:dart,tag:lang:java,tag:lang:go'
          --parallel=1

  flutter:
    name: Flutter quality gate
    needs: detect
    if: needs.detect.outputs.has-dart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
      - name: Install Flutter Version Management
        run: |
          dart pub global activate fvm 4.0.5
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - run: fvm install
      - run: >-
          ./hippo run --class ephemeral --resource-tier heavy --disk-path . --
          npx nx affected -t typecheck,lint,test:quick
          --exclude='tag:lang:ts,tag:lang:fsharp,tag:lang:csharp,tag:lang:rust,tag:lang:java,tag:lang:go'
          --parallel=1

  java:
    name: Java quality gate
    needs: detect
    if: needs.detect.outputs.has-java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-java
      - run: >-
          ./hippo run --class ephemeral --resource-tier heavy --disk-path . --
          npx nx affected -t typecheck,lint,test:quick,compat:min-version
          --exclude='tag:lang:ts,tag:lang:fsharp,tag:lang:csharp,tag:lang:rust,tag:lang:dart,tag:lang:go'
          --parallel=1

  go:
    name: Go quality gate
    needs: detect
    if: needs.detect.outputs.has-go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-go
      - run: >-
          ./hippo run --class ephemeral --resource-tier heavy --disk-path . --
          npx nx affected -t typecheck,lint,test:quick,compat:min-version
          --exclude='tag:lang:ts,tag:lang:fsharp,tag:lang:csharp,tag:lang:rust,tag:lang:dart,tag:lang:java'
          --parallel=1

  quality-gate:
    name: Quality gate
    needs: [repository-policy, typescript, dotnet, flutter, java, go]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all gates
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more quality gate jobs failed" >&2
            exit 1
          fi
          echo "All quality gates passed"
