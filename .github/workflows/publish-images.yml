name: publish-images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  detect:
    name: Detect affected images
    runs-on: ubuntu-latest
    outputs:
      build-organiclever-be: ${{ steps.detect.outputs.build-organiclever-be }}
      build-ose-be: ${{ steps.detect.outputs.build-ose-be }}
    env:
      NX_BASE: ${{ github.event.before }}
      NX_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - id: detect
        run: |
          # Fall back to HEAD~1 when before is the null SHA (first push / force-push)
          BASE="${{ github.event.before }}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          export NX_BASE="$BASE"
          AFFECTED=$(npx nx show projects --affected 2>/dev/null || echo "")
          {
            echo "build-organiclever-be=false"
            echo "build-ose-be=false"
          } >> "$GITHUB_OUTPUT"
          for project in $AFFECTED; do
            case "$project" in
              organiclever-be) echo "build-organiclever-be=true" >> "$GITHUB_OUTPUT" ;;
              ose-be) echo "build-ose-be=true" >> "$GITHUB_OUTPUT" ;;
            esac
          done

  publish-organiclever-be:
    name: Publish organiclever-be
    needs: detect
    if: needs.detect.outputs.build-organiclever-be == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-podman
      - name: Generate OpenAPI contract types
        run: npx nx run organiclever-be:codegen
      - name: Log in to GHCR with an ephemeral auth file
        env:
          REGISTRY_ACTOR: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          auth_file="${RUNNER_TEMP}/ghcr-auth.json"
          printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io --username "$REGISTRY_ACTOR" --password-stdin --authfile "$auth_file"
      - name: Build and push organiclever-be
        run: |
          set -euo pipefail
          auth_file="${RUNNER_TEMP}/ghcr-auth.json"
          podman build --layers --format docker -f apps/organiclever-be/Dockerfile \
            -t ghcr.io/wahidyankf/organiclever-be:latest \
            -t ghcr.io/wahidyankf/organiclever-be:${{ github.sha }} \
            .
          podman push --authfile "$auth_file" ghcr.io/wahidyankf/organiclever-be:latest
          podman push --authfile "$auth_file" ghcr.io/wahidyankf/organiclever-be:${{ github.sha }}
      - name: Remove the ephemeral registry auth file
        if: always()
        run: rm -f "${RUNNER_TEMP}/ghcr-auth.json"

  publish-ose-be:
    name: Publish ose-be
    needs: detect
    if: needs.detect.outputs.build-ose-be == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-podman
      - name: Generate OpenAPI contract types
        run: npx nx run ose-be:codegen
      - name: Log in to GHCR with an ephemeral auth file
        env:
          REGISTRY_ACTOR: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          auth_file="${RUNNER_TEMP}/ghcr-auth.json"
          printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io --username "$REGISTRY_ACTOR" --password-stdin --authfile "$auth_file"
      - name: Build and push ose-be
        run: |
          set -euo pipefail
          auth_file="${RUNNER_TEMP}/ghcr-auth.json"
          podman build --layers --format docker -f apps/ose-be/Dockerfile \
            -t ghcr.io/wahidyankf/ose-be:latest \
            -t ghcr.io/wahidyankf/ose-be:${{ github.sha }} \
            .
          podman push --authfile "$auth_file" ghcr.io/wahidyankf/ose-be:latest
          podman push --authfile "$auth_file" ghcr.io/wahidyankf/ose-be:${{ github.sha }}
      - name: Remove the ephemeral registry auth file
        if: always()
        run: rm -f "${RUNNER_TEMP}/ghcr-auth.json"
