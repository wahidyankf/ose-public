# hadolint configuration for ose-public
# Applied repo-wide: hadolint auto-discovers .hadolint.yaml from the working
# directory, and the `hadolint` gate (scripts/lint-dockerfiles) runs from the
# repository root at pre-commit and on the pull-request surface.

# Gate at warning-and-above (matches the wrapper's `--failure-threshold warning`).
failure-threshold: warning

# Registries our images are allowed to build FROM:
#   docker.io          - official node/debian/rust/golang base images
#   mcr.microsoft.com  - .NET SDK/runtime images for crane-be (F#)
#   ghcr.io            - our own published images
trustedRegistries:
  - docker.io
  - mcr.microsoft.com
  - ghcr.io

ignored:
  # DL3008 - "pin versions in apt-get install". Exact apt version pins make
  # images brittle: upstream Debian/Ubuntu repositories drop old package
  # versions, breaking `docker build` on any cache miss. Reproducibility comes
  # from the pinned base-image tag instead, not from per-package apt pins.
  - DL3008
  # DL3018 - "pin versions in apk add". Same rationale as DL3008 for the Alpine
  # dev images: Alpine's rolling package repository makes exact apk pins fragile.
  - DL3018
