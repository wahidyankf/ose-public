schema: ayokoding.run/v1
toolchain: go
runs:
  - name: main
    # `go run` executes its build scratch from /tmp, which the harness
    # mounts noexec; compiling to the working copy and executing there
    # keeps the run on an executable filesystem.
    command: [sh, -c, "go build -o main main.go && ./main"]
    expect:
      exit: 0
      stdout: expected/main.stdout.txt
