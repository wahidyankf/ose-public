schema: ayokoding.run/v1
toolchain: powershell
runs:
  - name: main
    command: [pwsh, -NoProfile, -File, hello.ps1]
    expect:
      exit: 0
      stdout: expected/main.stdout.txt
      # The image is amd64-only, so the client prints its platform warning
      # to stderr on arm64 hosts.
      stderr: expected/main.stderr.txt
