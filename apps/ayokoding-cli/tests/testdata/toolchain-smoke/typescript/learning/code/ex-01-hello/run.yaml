schema: ayokoding.run/v1
toolchain: typescript
runs:
  - name: build
    kind: check
    command: [tsc, main.ts]
    expect:
      exit: 0
      stdout: ignore
  - name: main
    # Each execution gets a fresh working copy, so the run recompiles
    # before executing the script the build run checks.
    command: [sh, -c, "tsc main.ts && node main.js"]
    expect:
      exit: 0
      stdout: expected/main.stdout.txt
