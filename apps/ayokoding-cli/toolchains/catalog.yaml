    build: lua/Dockerfile
  - id: luajit
    kind: language
    version: "v2.1 at commit 2a8e017"
    image: ayokoding-toolchain/luajit:071b09ec4233e8724109a95572118460ee156fd33fcbe0e10b6185328bef10d4@sha256:071b09ec4233e8724109a95572118460ee156fd33fcbe0e10b6185328bef10d4
