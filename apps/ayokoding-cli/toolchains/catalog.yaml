    version: "25.0.4.1+1"
    image: docker.io/library/eclipse-temurin:25-jdk@sha256:2d5d5e9b533342a565907c84f47a2ec298c40cde7b13a3ca85d4950fa456a641
  - id: kotlin
    kind: language
    version: "2.4.21"
    image: ayokoding-toolchain/kotlin:812eaeff10297e717fd044f54eac1525dbe72932f95b9816274ab343969b0b1e@sha256:812eaeff10297e717fd044f54eac1525dbe72932f95b9816274ab343969b0b1e
    build: kotlin/Dockerfile
  - id: dotnet
    kind: language
    version: "10.0.402"
    image: mcr.microsoft.com/dotnet/sdk:10.0@sha256:0d99ebf1ccad15037b5c98c9fe8979d6b8dbac23812feae2277a0b277b5c5ffa
    env:
      # The SDK 10 CLI refuses to start when HOME names a missing folder,
      # and the harness HOME (/tmp/home) is never created. Point HOME at
      # the container /tmp, which always exists and is private per run.
      HOME: /tmp
  - id: elixir
    kind: language
    version: "1.20.4 (OTP 29.1.2)"
    image: docker.io/library/elixir:1.20-otp-29@sha256:8241e27b8915d197eb8df4783f14490de9c9c335d03bd8a5d5613005cb2d7fc2
