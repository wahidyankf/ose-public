    version: "16.2"
    image: docker.io/library/gcc:16@sha256:17043c23ec2ad97fc3beca18da77275d26be5db5cd70ea0a5d73200e21a8e999
  - id: racket
    kind: language
    version: "9.3"
    image: docker.io/racket/racket:9.3@sha256:9e175f049faa155ca5137dcb6d56799a7511072495271c56d4778e0639e6e3af
  - id: ocaml
    kind: language
    version: "5.5.1"
    image: ayokoding-toolchain/ocaml:639060383d59e0aaf10bdadfe8a044a96336f7324fb5afc272fb9b6cdce49a64@sha256:639060383d59e0aaf10bdadfe8a044a96336f7324fb5afc272fb9b6cdce49a64
    build: ocaml/Dockerfile
  - id: swift
    kind: language
    version: "6.4.1"
    image: docker.io/library/swift:6.4@sha256:6fbd5978b56a5a9ff05a48f8f678079fc45be496ecda15b4e74e8944fab857be
  - id: dart
    kind: language
    version: "3.13.5"
    image: docker.io/library/dart:3.13@sha256:8604cbd137b6d67c24f49b916f2aa9b67d71b539576e0178bf161d831c9e344f
  - id: flutter
    kind: language
    version: "3.41.5"
    image: ayokoding-toolchain/flutter:cc4fd8e235a66b354d33632de23d2146af1722a40df631fcc55fa44189b3a4c8@sha256:cc4fd8e235a66b354d33632de23d2146af1722a40df631fcc55fa44189b3a4c8
    build: flutter/Dockerfile
    # The SDK publishes a linux x64 archive only, so the harness builds
    # and runs this image for linux/amd64 on every host.
    platform: linux/amd64
    env:
      # The SDK checkout at /opt/flutter is owned by the image user, so
      # every git call the tool makes needs this exception; env config
      # reaches the harness user, unlike the image-home gitconfig.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /opt/flutter
  - id: shell
    kind: language
    version: "Debian trixie snapshot"
    image: ayokoding-toolchain/shell:a9e969bb659a65d9a2a74d75d42a324c58f62bbac87927a43981426bbf52b57a@sha256:a9e969bb659a65d9a2a74d75d42a324c58f62bbac87927a43981426bbf52b57a
    build: shell/Dockerfile
  - id: powershell
    kind: language
    version: "7.4 LTS"
    image: mcr.microsoft.com/powershell:7.4-ubuntu-22.04@sha256:62300a213a9293916333df2b014cd3a8f22fb0b0b65f2bb446aaf436bcf8c868
