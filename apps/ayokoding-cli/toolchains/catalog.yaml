    image: ayokoding-toolchain/shell:a9e969bb659a65d9a2a74d75d42a324c58f62bbac87927a43981426bbf52b57a@sha256:a9e969bb659a65d9a2a74d75d42a324c58f62bbac87927a43981426bbf52b57a
