    kind: service
    version: "18.6"
    image: docker.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    env:
      POSTGRES_HOST_AUTH_METHOD: trust
    ready: [pg_isready, -h, 127.0.0.1, -U, postgres]
    readyTimeout: 60s
    connect:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: postgres
  - id: neo4j
    kind: service
    version: "2026.09.0 Community"
    image: docker.io/library/neo4j:2026.09.0@sha256:d6269a020149934597c8c3df926d080a612796dbbb48861ca9d5b1109cabf0d8
    env:
      NEO4J_AUTH: none
    ready: [cypher-shell, RETURN 1 AS one]
    readyTimeout: 60s
    connect:
      NEO4J_HOST: neo4j
  - id: swift-parse
    kind: validator
    version: "6.4.1"
