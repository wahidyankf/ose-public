# Toolchain catalog. Versions re-checked in Phase 0; every image carries its
# Phase 3 digest pin (official and project images by registry digest,
# derived images by content-hash tag), so the CLI loads this catalog.
schema: ayokoding.toolchains/v1
toolchains:
  - id: python
    kind: language
    version: "3.15.0"
    image: docker.io/library/python:3.15@sha256:e748956ccf3f50c9555f236753bbcd5f430d3937e665d3bd6922dd0e6e591a24
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    install:
      lockfiles: [requirements.lock]
      command: [pip, install, --require-hashes, --no-deps, --target, /deps/python, -r, /deps/lock/requirements.lock]
      env:
        PYTHONPATH: /deps/python
  - id: go
    kind: language
    version: "1.27.2"
    image: docker.io/library/golang:1.27@sha256:820153096fda4de6ac1b7194d12e416b7dd8f4e9a33d17e0345b111b945162d8
  - id: rust
    kind: language
    version: "1.99.1"
    # Locked units build an environment image whose install argv fetches
    # Cargo.lock into /deps/rust; the unit builds offline from that vendor
    # dir through --config source replacement twice alike.
    image: ayokoding-toolchain/rust:b88b87d6f58a6abaae6460d74f2d54dee7ada9807ca170ae36637668b8791d0b@sha256:b88b87d6f58a6abaae6460d74f2d54dee7ada9807ca170ae36637668b8791d0b
    build: rust/Dockerfile
    install:
      lockfiles: [Cargo.lock]
      command: [python3, /opt/tools/fetch.py, /deps/lock/Cargo.lock, /deps/rust]
  - id: node
    kind: language
    version: "24.22.0"
    image: docker.io/library/node:24@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0
  - id: typescript
    kind: language
    version: "7.0.2"
    image: ayokoding-toolchain/typescript:b7c9c03f556ecef1da8571cb3ddceb9697254b8d4b0a473b73672eb4821bdd14@sha256:b7c9c03f556ecef1da8571cb3ddceb9697254b8d4b0a473b73672eb4821bdd14
    build: typescript/Dockerfile
  - id: clojure
    kind: language
    version: "1.12.6"
    # Clojure 1.12.6 on Temurin JDK 25 with the three core jars named by its
    # POM (hashes recorded 2026-10-20). Locked units build an environment
    # image whose install argv fetches jars.lock into /deps/clojure (JARS);
    # the wrapper puts the core jars first, then the locked jars in sorted
    # file-name order as explicit entries.
    image: ayokoding-toolchain/clojure:7c9b9f0df0192c6010d9225ee3db9b1b27b1713e5c02894f748b81824cba9b6c@sha256:7c9b9f0df0192c6010d9225ee3db9b1b27b1713e5c02894f748b81824cba9b6c
    build: clojure/Dockerfile
    install:
      lockfiles: [jars.lock]
      command: [java, /opt/tools/JarFetch.java, /deps/lock/jars.lock, /deps/clojure]
      env:
        JARS: /deps/clojure
  - id: java
    kind: language
    version: "25.0.4.1+1"
    # Derived from the same Temurin base plus JarFetch, the hash-locked jar
    # installer. Units without a lockfile run on this image as before (the
    # default user is unchanged); locked units build an environment image
    # whose install argv fetches jars.lock into /deps/java (JARS).
    image: ayokoding-toolchain/java:d391a9a933425fb316e6e9583922deb8c137e8dfa8ce8b880a188447ab5138ab@sha256:d391a9a933425fb316e6e9583922deb8c137e8dfa8ce8b880a188447ab5138ab
    build: java/Dockerfile
    # Hash-locked jar install: JarFetch fetches each jars.lock line into
    # /deps/java (JARS). A line carries an optional third field naming the
    # repository (`central`, the default, or `clojars`); anything else fails
    # the build naming the line.
    install:
      lockfiles: [jars.lock]
      command: [java, /opt/tools/JarFetch.java, /deps/lock/jars.lock, /deps/java]
      env:
        JARS: /deps/java
  - id: kotlin
    kind: language
    version: "2.4.21"
    # Locked units build an environment image whose install argv fetches
    # jars.lock into /deps/kotlin (JARS), the same recipe as java and clojure.
    image: ayokoding-toolchain/kotlin:97e1de2aa6633e62efd282adc388f4cffc58b1f104c1bf5bc047a9673e47b1d3@sha256:97e1de2aa6633e62efd282adc388f4cffc58b1f104c1bf5bc047a9673e47b1d3
    build: kotlin/Dockerfile
    install:
      lockfiles: [jars.lock]
      command: [java, /opt/tools/JarFetch.java, /deps/lock/jars.lock, /deps/kotlin]
      env:
        JARS: /deps/kotlin
  - id: dotnet
    kind: language
    version: "10.0.402"
    image: mcr.microsoft.com/dotnet/sdk:10.0@sha256:0d99ebf1ccad15037b5c98c9fe8979d6b8dbac23812feae2277a0b277b5c5ffa
    env:
      # The SDK 10 CLI refuses to start when HOME names a missing folder,
      # and the harness HOME (/tmp/home) is never created. Point HOME at
      # the container /tmp, which always exists and is private per run.
      HOME: /tmp
    # Locked units build an environment image whose install argv restores
    # packages.lock.json into /deps/dotnet. NuGet's content hashes are not
    # nupkg checksums, so nothing but NuGet itself can check them: the
    # recipe rebuilds the locked project in /tmp and restores it with
    # --locked-mode (NU1403 on any tampered entry), then stages the
    # downloaded nupkgs. Units restore --locked-mode from /deps/dotnet.
    install:
      lockfiles: [packages.lock.json]
      command:
        - sh
        - -c
        - |
          set -eu
          lock=/deps/lock/packages.lock.json
          dest=/deps/dotnet
          work=/tmp/dotnet-fetch
          mkdir -p "$dest" "$work"
          cp "$lock" "$work/packages.lock.json"
          tfm=$(grep -o '"net[0-9][0-9.]*"' "$lock" | head -n 1 | tr -d '"')
          awk '/": \{$/ { key=$0 } /"resolved": "/ { line=key; sub(/^[^"]*"/, "", line); sub(/".*$/, "", line); name=line; ver=$0; sub(/^[^"]*"[^"]*"[^"]*"/, "", ver); sub(/".*$/, "", ver); print name" "ver }' "$lock" > "$work/refs.txt"
          {
            printf '%s\n' '<Project Sdk="Microsoft.NET.Sdk">' '  <PropertyGroup>' "    <TargetFramework>$tfm</TargetFramework>" '    <RestorePackagesWithLockFile>true</RestorePackagesWithLockFile>' '  </PropertyGroup>' '  <ItemGroup>'
            while read -r name ver; do
              printf '    <PackageReference Include="%s" Version="%s" />\n' "$name" "$ver"
            done < "$work/refs.txt"
            printf '%s\n' '  </ItemGroup>' '</Project>'
          } > "$work/fetch.csproj"
          dotnet restore "$work/fetch.csproj" --locked-mode
          cp "$HOME/.nuget/packages/"*/*/*.nupkg "$dest"/
