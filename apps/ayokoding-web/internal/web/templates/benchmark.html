{{define "benchmark"}}<!doctype html>
<html lang="{{.Shell.Lang}}" data-theme-hook>
  <head>
    {{template "head" .Shell}}
  </head>
  <body>
    {{template "header" .Shell}}
    <main id="main" tabindex="-1">
      <h1>{{if eq .Shell.Lang "id"}}Benchmark AI{{else}}AI Benchmark{{end}}</h1>
      <div id="benchmark" data-tool="benchmark">{{template "benchmark-fragment" .Fragment}}</div>
    </main>
    {{template "footer" .Shell}}
  </body>
</html>
{{end}}
