{{define "calculator"}}<!doctype html>
<html lang="{{.Shell.Lang}}" data-theme-hook>
  <head>
    {{template "head" .Shell}}
  </head>
  <body>
    {{template "header" .Shell}}
    <main id="main" tabindex="-1">
      <h1>{{if eq .Shell.Lang "id"}}Kalkulator Biaya Hidup{{else}}Cost of Living Calculator{{end}}</h1>
      <div id="calculator" data-tool="calculator">{{template "calculator-fragment" .Fragment}}</div>
    </main>
    {{template "footer" .Shell}}
  </body>
</html>
{{end}}
