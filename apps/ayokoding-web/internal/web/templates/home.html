{{define "home"}}<!doctype html>
<html lang="{{.Shell.Lang}}" data-theme-hook data-sidebar style="--sidebar-width: 240px">
  <head>
    {{template "head" .Shell}}
  </head>
  <body>
    {{template "header" .Shell}}
    <main id="main" tabindex="-1" data-theme="light">
      <h1>{{if eq .Shell.Lang "id"}}Belajar{{else}}Learn{{end}}</h1>
      <p data-lesson-meta data-public-metadata>{{.Shell.Description}}</p>
    </main>
    {{template "footer" .Shell}}
  </body>
</html>
{{end}}
