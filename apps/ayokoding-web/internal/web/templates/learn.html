{{define "learn"}}<!doctype html>
<html lang="{{.Shell.Lang}}" data-theme-hook>
  <head>
    {{template "head" .Shell}}
  </head>
  <body>
    {{template "header" .Shell}}
    <main id="main">
      <h1>{{if eq .Shell.Lang "id"}}Belajar{{else}}Learn{{end}}</h1>
      <nav aria-label="learn" data-learn-nav>
        <a href="/{{.Shell.Lang}}/learn/paths">{{if eq .Shell.Lang "id"}}Jalur{{else}}Paths{{end}}</a>
        <a href="/{{.Shell.Lang}}/learn/courses">{{if eq .Shell.Lang "id"}}Kursus{{else}}Courses{{end}}</a>
        <a href="/{{.Shell.Lang}}/learn/legacy/software-engineering">Legacy</a>
      </nav>
      <div>
        <button type="button" id="reset-control" data-progress-control="reset-trigger">
          {{if eq .Shell.Lang "id"}}Atur ulang progres{{else}}Reset progress{{end}}
        </button>
        <p role="status" aria-live="polite"></p>
      </div>
    </main>
    {{template "footer" .Shell}}
  </body>
</html>
{{end}}
