{{define "search"}}{{if .Results}}
<ul data-search-results data-query="{{.Query}}">
  {{range .Results}}
  <li data-result="{{.URL}}">
    <a href="{{.URL}}">{{.Title}}</a>
    <p>{{.Section}} — {{.Excerpt}}</p>
  </li>
  {{end}}
</ul>
{{else}}
<p data-search-empty data-query="{{.Query}}">No results.</p>
{{end}}{{end}} {{define "search-invalid"}}
<p data-search-invalid data-code="invalid_search" data-query="{{.Query}}">Invalid search. Try another query.</p>
{{end}}
