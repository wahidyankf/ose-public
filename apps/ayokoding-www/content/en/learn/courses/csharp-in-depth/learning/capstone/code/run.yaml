schema: ayokoding.run/v1
toolchain: dotnet
runs:
  - name: main
    command: [sh, -c, "dotnet build --nologo -v q > /dev/null && dotnet bin/Debug/net10.0/app.dll input.txt"]
    expect:
      exit: 0
      stdout: expected/main/main.stdout.txt
      stderr: ignore
  - name: selftest
    command: [sh, -c, "dotnet build --nologo -v q > /dev/null && dotnet bin/Debug/net10.0/app.dll --self-test"]
    expect:
      exit: 0
      stdout: expected/test/test.stdout.txt
      stderr: ignore
