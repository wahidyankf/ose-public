# Scoped ruff config for this Annotated-concept topic's runnable code (learning/code/**,
# learning/capstone/code/**).
#
# Why this file exists: every example in this topic carries a dense trailing
# `# => ...` educational annotation on nearly every code line (the
# annotated-concept convention's annotation-density requirement). The repo has
# no root-level ruff config, so `ruff format` (run by the pre-commit
# format-staged gate) uses its default line-length of 88, which wraps many of
# these single-line statements across 2-5 physical lines -- once wrapped, the
# extra unannotated physical lines silently pull annotation density below the
# required 1.0-per-code-line floor without changing any logic, and the
# markdown pages' embedded code blocks (kept byte-identical to these files)
# drift out of sync. See `../evaluating-ai-output-essentials/ruff.toml` for
# the same fix applied to an earlier topic that hit this identical failure
# mode.
#
# 320 is ruff's own configuration ceiling (ruff format --config rejects any
# value above 320). The longest annotated/inlined-SQL line in this topic
# (the capstone's transform.py) was trimmed to fit under this ceiling, so
# `ruff format` stays a no-op here.
line-length = 320
