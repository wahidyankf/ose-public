[package]
name = "sqlx-migration-example"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "capstone"
path = "main.rs"

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
