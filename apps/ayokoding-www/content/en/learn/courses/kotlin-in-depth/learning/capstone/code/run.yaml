schema: ayokoding.run/v1
toolchain: kotlin
runs:
  - name: test
    command: [sh, -c, "kotlinc Tally.kt TallyTest.kt -include-runtime -d test.jar 2>/dev/null && java -jar test.jar"]
    expect:
      exit: 0
      stdout: expected/test/test.stdout.txt
  - name: main
    command: [sh, -c, "kotlinc Tally.kt Main.kt -include-runtime -d main.jar 2>/dev/null && java -jar main.jar"]
    expect:
      exit: 0
      stdout: expected/main/main.stdout.txt
