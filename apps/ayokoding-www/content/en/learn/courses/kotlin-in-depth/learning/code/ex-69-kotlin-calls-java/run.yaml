schema: ayokoding.run/v1
toolchain: kotlin
runs:
  - name: main
    command:
      [
        sh,
        -c,
        "javac Legacy.java && kotlinc Main.kt -cp . -include-runtime -d main.jar 2>/dev/null && java -cp main.jar:. MainKt",
      ]
    expect:
      exit: 0
      stdout: expected/main.stdout.txt
