schema: ayokoding.run/v1
toolchain: dotnet
dependencies:
  lockfile: drilling/code/kata-04-middleware-chain-auth-and-logging/packages.lock.json
resources:
  memory: 2g
runs:
  - name: main
    # Offline hardening: the run container has a Docker DNS that blackholes
    # external names, and NuGet's per-package online checks (certificate
    # revocation) stall on it for ~50s per package. Revocation in offline
    # mode plus telemetry/first-run opt-outs keeps restore fully local.
    env:
      NUGET_CERT_REVOCATION_MODE: offline
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_NOLOGO: "1"
    # Only the after/ solution builds and runs; before/ is the starter.
    command:
      [
        sh,
        -c,
        "dotnet restore after/app.csproj --locked-mode > /dev/null && dotnet build after/app.csproj --nologo -v q --no-restore > /dev/null && dotnet after/bin/Debug/net10.0/app.dll",
      ]
    timeout: 600s
    expect:
      exit: 0
      stdout: expected/main.stdout.txt
      # Offline workload verification notes to stderr on every invocation.
      stderr: ignore
