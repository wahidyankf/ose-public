[package]
name = "axum-example"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "capstone"
path = "main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["trace", "cors", "timeout", "limit", "request-id"] }
