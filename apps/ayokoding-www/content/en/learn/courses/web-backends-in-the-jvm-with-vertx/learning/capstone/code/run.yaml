schema: ayokoding.run/v1
toolchain: java
dependencies:
  lockfile: learning/code/jars.lock
runs:
  - name: main
    command: [sh, -c, 'javac -cp "$JARS/*" Main.java && java -cp ".:$JARS/*" Main']
    timeout: 600s
    expect:
      exit: 0
      stdout: expected/main/main.stdout.txt
      stderr: ignore
