schema: ayokoding.run/v1
toolchain: webassembly
runs:
  - name: main
    command: [wazero, run, -mount, .:/data:ro, -mount, /tmp:/tmp, capstone.wasm]
    expect:
      exit: 0
      stdout: expected/main/main.stdout.txt
  - name: test
    command: [sh, -c, 'wazero run test.wasm | sed -e "s/finished in [0-9.]*s/finished in 0.00s/"']
    expect:
      exit: 0
      stdout: expected/test/test.stdout.txt
