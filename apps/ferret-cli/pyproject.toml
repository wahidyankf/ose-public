[project]
name = "ferret-cli"
version = "0.1.1"
description = "FERRET: local-first, metadata-only telemetry for coding-agent harnesses."
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "pyright>=1.1.414",
  "pytest>=9.1",
  "pytest-bdd>=8.1",
  "pytest-cov>=7.0",
  "ruff>=0.16.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = ["src", "scripts", "tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]
xfail_strict = true

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PT", "RUF"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
extraPaths = ["src", "scripts", "tests"]
venvPath = "."
venv = ".venv"

[tool.coverage.run]
# Named boundary adapters only: each is wholly an operating-system, SQLite, or clock boundary and is exercised
# by the Integration adapter, so no core logic leaves the Unit denominator.
omit = [
  "*/ferret/adapters/posix_install.py",
  "*/ferret/adapters/posix_storage.py",
  "*/ferret/adapters/posix_workspace.py",
  "*/ferret/adapters/sqlite_repository.py",
  "*/ferret/adapters/sqlite_schema.py",
  "*/ferret/adapters/system.py",
]
