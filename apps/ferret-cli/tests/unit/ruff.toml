# Hermetic unit tests (C21): this file adds the banned-API and naive-clock rules for tests/unit only.
# It extends the project configuration and adds rules; it never removes or ignores one.
extend = "../../pyproject.toml"

[lint]
extend-select = ["DTZ", "TID251"]

[lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "unit tests are hermetic: no process; pass a double for the process runner (C12)"
"socket".msg = "unit tests are hermetic: no network; use deny_network or a double (C12)"
"http".msg = "unit tests are hermetic: no network; use a double (C12)"
"urllib".msg = "unit tests are hermetic: no network; use a double (C12)"
"sqlite3".msg = "unit tests use the in-memory fake from tests/support, never a database file (C12)"
"shutil".msg = "unit tests are hermetic: no file system operations; use a fake (C12)"
"random".msg = "unit tests are hermetic: no randomness; use a fixed sequence double (C12)"
"secrets".msg = "unit tests are hermetic: no randomness; use a fixed sequence double (C12)"
"uuid.uuid4".msg = "unit tests are hermetic: no randomness; inject an identifier source (C12)"
"os.urandom".msg = "unit tests are hermetic: no randomness; inject an entropy source (C12)"
"time.sleep".msg = "unit tests are hermetic: no real waiting; use a controlled timer (C12)"
"time.time".msg = "unit tests are hermetic: read the clock through an injected fixed clock (C12)"
"time.time_ns".msg = "unit tests are hermetic: read the clock through an injected fixed clock (C12)"
"time.monotonic".msg = "unit tests are hermetic: read the clock through an injected fixed clock (C12)"
"time.monotonic_ns".msg = "unit tests are hermetic: read the clock through an injected fixed clock (C12)"
"datetime.datetime.now".msg = "unit tests are hermetic: pass a fixed clock instead of reading the wall clock (C12)"
"datetime.datetime.utcnow".msg = "unit tests are hermetic: pass a fixed clock instead of reading the wall clock (C12)"
"datetime.datetime.today".msg = "unit tests are hermetic: pass a fixed clock instead of reading the wall clock (C12)"
"datetime.date.today".msg = "unit tests are hermetic: pass a fixed clock instead of reading the wall clock (C12)"
"os.environ".msg = "unit tests are hermetic: no environment; pass a mapping to the code under test (C12)"
"os.getenv".msg = "unit tests are hermetic: no environment; pass a mapping to the code under test (C12)"
"os.putenv".msg = "unit tests are hermetic: no environment; pass a mapping to the code under test (C12)"
"os.getuid".msg = "unit tests are hermetic: no process identity; inject it (C12)"
"pwd".msg = "unit tests are hermetic: no account database; inject the home directory (C12)"
"os.replace".msg = "unit tests are hermetic: no file system operations; use a fake (C12)"
"os.rename".msg = "unit tests are hermetic: no file system operations; use a fake (C12)"
