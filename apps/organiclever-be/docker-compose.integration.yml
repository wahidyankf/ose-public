services:
  postgres:
    image: docker.io/library/postgres:17.10-alpine3.22
    environment:
      POSTGRES_DB: organiclever_be_test
      POSTGRES_USER: organiclever_be
      POSTGRES_PASSWORD: organiclever_be
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U organiclever_be -d organiclever_be_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data

  nats:
    image: docker.io/library/nats:latest
    command: ["-js"]
    ports:
      - "4224:4222"
