services:
  postgres:
    image: docker.io/library/postgres:17.10-alpine3.22
    environment:
      POSTGRES_DB: ose_app_be_test
      POSTGRES_USER: ose_app_be
      POSTGRES_PASSWORD: ose_app_be
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ose_app_be -d ose_app_be_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  nats:
    image: docker.io/library/nats:latest
    command: ["-js"]
    ports:
      - "4223:4222"
