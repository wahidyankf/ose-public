services:
  ayokoding-www:
    build:
      context: ../../../
      dockerfile: apps/ayokoding-www/Dockerfile
    ports:
      - "3101:3101"
    environment:
      - AYOKODING_WEB_CONTENT_DIR=/app/apps/ayokoding-www/content
      - PORT=3101
      - HOSTNAME=0.0.0.0
      # course-paths plan (Phase 3): points the container's manifest loader at the e2e fixture
      # manifest set baked into the image (see the Dockerfile's fixtures COPY step) instead of the
      # real, still-unpopulated manifests/ directory.
      - AYOKODING_WEB_MANIFESTS_DIR=/app/apps/ayokoding-www-fe-e2e/fixtures/manifests
      # course-paths plan (Phase 3, PR-review fix): the skills/e2e-fixture-{alpha,beta} content
      # pages are authored draft: true so they never render on prod-ayokoding-www — this makes
      # them visible to the e2e run that needs their authored body content (mirrors
      # playwright.config.ts's own local webServer.env for the same reason).
      - AYOKODING_WEB_SHOW_DRAFTS=true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3101/api/trpc/meta.health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
