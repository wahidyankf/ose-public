services:
  ose-www:
    build:
      context: ../../../
      dockerfile: apps/ose-www/Dockerfile
    ports:
      - "3100:3100"
    environment:
      - CONTENT_DIR=/workspace/apps/ose-www/content
      - PORT=3100
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3100/api/trpc/health.check"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
