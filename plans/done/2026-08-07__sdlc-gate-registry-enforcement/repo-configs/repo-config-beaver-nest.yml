# TARGET STATE — do not copy this banner into the repo.
#
# This is the COMPLETE repo-config.yml as it should look in beaver-nest AFTER the
# sdlc-gate-registry-enforcement plan lands. Apart from the intended
# `harness.amazonq.agent-name` and `doctor.dotnet-global-json` additions, content
# above the `gates:` section is this repo's current YAML as of 2026-08-04. This
# plan also corrects the stale header below and adds the `gates:` section at end.
#
# Before copying, re-verify the unchanged part still matches:
#   diff <(sed -n '/^harness:/,/^gates:/p' <this file> | sed '$d' | sed '$d') \
#        <(sed -n '/^harness:/,$p' beaver-nest/repo-config.yml)
# The range compares existing YAML while excluding this banner, the deliberately
# corrected header, and the new `gates:` section. The intentional `agent-name`
# and `dotnet-global-json` additions are the only expected differences; reconcile
# any others rather than overwrite.
#
# repo-config.yml — schema: rhino-cli/repo-config/v1
#
# Unified repository configuration. All four OSE repositories share the same
# rhino-cli schema; section presence and values reflect each repo's actual project
# set and surfaces. rhino-cli commands read their relevant section.
#
# Sections defined here:
#   harness          — all-harness binding registry (§3.2); EVERY `harness` command reads this list
#   coverage         — per-project test-level registry (specs:behavior:coverage + specs:domain:coverage)
#   specs            — spec-tree structure config (specs:structure-validation)
#   instruction-size — per-surface instruction-file byte budgets (rhino-cli harness instruction-size validate)
#   env-contract     — surface registry for rhino-cli env validate (code↔config drift detection)
#   env-injection    — value-less injection manifest for rhino-cli env validate (manifest-consistency)
#   doctor           — tool exclusions and the optional .NET SDK version source (rhino-cli doctor)
#   gates            — executable SDLC gate registry and per-surface composition data

harness:
  # Authoritative harness registry — all 11 supported coding-agent harnesses.
  # Fields per entry:
  #   name        — harness identifier
  #   tier        — source | generated | source-config | native
  #   agent-dir   — directory of per-agent files (naming/duplication checks)
  #   skills-dir  — directory of skill files (source tier only)
  #   rules-dir   — directory of injected rules (generated tier only)
  #   agent-name  — generated Amazon Q agent-definition filename stem and embedded name (amazonq only)
  #   mirrors     — source agent-dir this entry must mirror (generated tier)
  #   config      — config file path (source-config tier)
  #   forbid-dir  — directory that must NOT exist (source-config tier)
  #   shadow      — thin-pointer file to check for no-shadowing (native tier)
  #   instruction — instruction surfaces this harness reads (instruction-size budget)
  #
  # Adding a 12th harness = one entry here; every harness command picks it up automatically.
  - { name: claude-code, tier: source, agent-dir: .claude/agents, skills-dir: .claude/skills, instruction: [CLAUDE.md] }
  - { name: opencode, tier: generated, agent-dir: .opencode/agents, mirrors: .claude/agents }
  - name: amazonq
    tier: generated
    rules-dir: .amazonq/rules
    agent-name: beaver-nest-default
    instruction:
      - .amazonq/rules/*.md
  - name: codex
    tier: source-config
    config: .codex/config.toml
    forbid-dir: .codex/agents
    instruction:
      - AGENTS.md
  - {
      name: copilot,
      tier: native,
      shadow: .github/copilot-instructions.md,
      instruction: [AGENTS.md, .github/copilot-instructions.md],
    }
  - name: cursor
    tier: generated
    agent-dir: .cursor/agents
    mirrors: .claude/agents
    shadow: .cursor/rules
    instruction: [AGENTS.md, .cursor/rules]
  - { name: windsurf, tier: native, shadow: .windsurf/rules, instruction: [AGENTS.md, .windsurf/rules] }
  - { name: junie, tier: native, shadow: .junie/guidelines.md, instruction: [AGENTS.md, .junie/guidelines.md] }
  - { name: antigravity, tier: native, shadow: GEMINI.md, instruction: [AGENTS.md, GEMINI.md] }
  - { name: pi, tier: native, instruction: [AGENTS.md, CLAUDE.md] }
  - { name: aider, tier: native, shadow: CONVENTIONS.md, instruction: [AGENTS.md, CONVENTIONS.md] }

coverage:
  # Explicit per-project test-level registry. One entry per Nx project (apps,
  # libs, *-e2e). No convention-derived defaults — every project is listed.
  # A scenario's level envelope P = union of `levels` across ALL entries whose
  # `specs` glob matches that scenario's feature file.
  # `levels` = the test levels this project runs at.
  # `specs`  = the feature-file glob this project owns (surface-precise for apps;
  #             per-project for libs).
  projects:
    # rhino-cli (tooling)
    - name: rhino-cli
      levels: [unit, integration]
      specs: "specs/apps/rhino/behavior/rhino-cli/**"

    # beaver-nest domain
    - name: beaver-nest-be
      levels: [unit, integration]
      specs: "specs/apps/beaver-nest/behavior/beaver-nest-be/**"

    - name: beaver-nest-be-e2e
      levels: [e2e]
      specs: "specs/apps/beaver-nest/behavior/beaver-nest-be/**"

    - name: beaver-nest-fe
      levels: [unit]
      specs: "specs/apps/beaver-nest/behavior/beaver-nest-fe/**"

    - name: beaver-nest-fe-e2e
      levels: [e2e]
      specs: "specs/apps/beaver-nest/behavior/beaver-nest-fe/**"

    # Deliberately excluded, not omitted by oversight: beaver-nest-contracts's test-level
    # targets (test:unit/test:integration/test:e2e) are documented no-ops ("target not
    # applicable for this project"). Its real quality gate is lint (redocly) and bundle,
    # not a Gherkin-driven test level this registry models — an entry here would
    # misleadingly claim behavior-spec coverage that doesn't exist. Same reasoning the
    # predecessor repo applied to its own ose-contracts/organiclever-contracts projects.

specs:
  # Areas that must carry a ddd/ folder (bounded-context registry). Lifts the
  # hardcoded apps_with_ddd() allowlist into explicit config.
  # An area NOT listed must NOT carry ddd/ (unlisted area with ddd/ = error).
  ddd-areas: []

  # Areas eligible for specs:domain:coverage (explicit allowlist; distinct from
  # ddd-areas). A project NOT listed is skipped even if it has domain/** features.
  # Today: the *-be backends that own domain-bounded-context feature files.
  domain-areas: []

instruction-size:
  surfaces:
    - glob: "AGENTS.md"
      target: 24000
      warn: 27000
      fail: 30000
    - glob: "**/AGENTS.md"
      target: 24000
      warn: 27000
      fail: 30000
    - glob: "CLAUDE.md"
      target: 6000
      warn: 8000
      fail: 10000
    - glob: ".amazonq/rules/*.md"
      target: 4000
      warn: 8000
      fail: 12000
    - glob: ".windsurf/rules/*.md"
      target: 6000
      warn: 9000
      fail: 12000
    - glob: ".cursor/rules/*.mdc"
      target: 4000
      warn: 8000
      fail: 12000
    - glob: ".junie/guidelines.md"
      target: 6000
      warn: 8000
      fail: 10000
    - glob: ".github/copilot-instructions.md"
      target: 6000
      warn: 8000
      fail: 10000
    - glob: "CONVENTIONS.md"
      target: 10000
      warn: 13000
      fail: 16000
  resolved_tree:
    root: "CLAUDE.md"
    target: 30000
    warn: 34000
    fail: 38000

env-contract:
  # Surface registry for rhino-cli env validate (code↔config drift detection).
  # Companion: env-injection: declares, per app, the injection HOME for each key
  # at every deploy stage (names only, never values).
  #
  # Each surface entry carries:
  #   root      — path relative to repo root
  #   kind      — "app" (active); "terraform"/"ansible" are forward-scaffold
  #   lang      — "rust" or "typescript" (app kind only)
  #   allowlist — keys exempt from drift detection (framework-injected, test-only, etc.)
  surfaces:
    - root: apps/beaver-nest-be
      kind: app
      lang: fsharp
      allowlist:
        # External operator and wrapper inputs are declared here but consumed
        # outside the F# process. Source-consumed listener and SQLite keys are
        # intentionally not allowlisted so env validation detects drift.
        - BEAVER_NEST_BE_DEVELOPMENT_DATA_DIRECTORY
        - BEAVER_NEST_BE_HOST_DATA_DIRECTORY
        - BEAVER_NEST_BE_VPN_HOST_IP
        - BEAVER_NEST_BE_PUBLIC_PORT
        - BEAVER_NEST_BE_BACKUP_DIRECTORY

env-injection:
  # Value-less injection contract (extends env-contract:).
  # Declares, per app, the injection HOME for its env keys at every deploy stage
  # it runs in — NAMES ONLY, never values.
  #
  # Injection homes:
  #   env-local         — gitignored apps/<app>/.env.local (developer machine)
  #   compose           — infra/dev/<stack> docker-compose env (local CI), placeholders only
  #   vercel-preview     — Vercel project env, Preview scope (stag-*-app-web branch)
  #   vercel-production  — Vercel project env, Production scope (prod-*-www / prod-*-app-web)
  #   k3s-coralpolyp     — private-sibling coralpolyp secret store (backend k3s rollout)
  apps:
    - app: beaver-nest-be
      keys-from: apps/beaver-nest-be/.env.example
      runtime: { local: env-local, local-ci: compose }

  # CI test-harness keys — test-only, NEVER in any apps/<app>/.env.example.
  ci-harness:
    - key: API_BASE_URL
      class: var
      environments: [beaver-nest-app-staging]
    - key: WEB_BASE_URL
      class: var
      environments: [beaver-nest-app-staging]
    - key: VERCEL_AUTOMATION_BYPASS_SECRET
      class: secret
      environments: [beaver-nest-app-staging]
    - key: PLAYWRIGHT_GREP_INVERT
      class: literal
      environments: []

doctor:
  dotnet-global-json: apps/beaver-nest-be/global.json

gates:
  # ---------------------------------------------------------------- commit-msg
  - id: commitlint
    type: check
    command: 'npx --no -- commitlint --edit "$1"'
    kind: external
    surfaces:
      commit-msg: { scope: other }

  # -------------------------------------------- pre-commit: guards before work
  - id: env-staged-guard
    type: check
    command: env staged-guard validate
    kind: rhino-cli
    carve-out: staged-only
    surfaces:
      pre-commit: { scope: other }

  - id: repo-config-schema
    type: check
    command: repo-config validate
    kind: rhino-cli
    surfaces:
      pre-commit:
        scope: affected-file-type
        glob: repo-config.yml
        lint-staged-shell: "{{command}}"
      ci: { scope: other }

  # ------------------------------------------- formatters (5) + verifiers (5)
  - id: format-prettier
    type: mutation
    category: formatter
    command: prettier --write
    kind: external
    restages: true
    surfaces:
      pre-commit:
        scope: affected-file-type
        globs:
          - "*.md"
          - "*.{js,jsx,ts,tsx,mjs,cjs}"
          - "*.json"
          - "*.{yml,yaml}"
          - "*.{css,scss}"
          - "*.html"

  - id: format-verify-prettier
    type: check
    command: prettier --check
    kind: external
    verifies: format-prettier
    surfaces:
      ci:
        scope: affected-file-type
        glob: "*.{md,json,yml,yaml,css,scss,html,ts,tsx,js,jsx,mjs,cjs}"

  - id: format-rustfmt
    type: mutation
    category: formatter
    command: rustfmt --edition 2024
    kind: external
    restages: true
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.rs" }

  - id: format-verify-rustfmt
    type: check
    command: rustfmt --edition 2024 --check
    kind: external
    verifies: format-rustfmt
    surfaces:
      ci: { scope: affected-file-type, glob: "*.rs" }

  - id: format-fantomas
    type: mutation
    category: formatter
    command: fantomas
    kind: external
    restages: true
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.fs" }

  - id: format-verify-fantomas
    type: check
    # Exits 99 when unformatted, 1 on unexpected error. Any non-zero fails.
    command: fantomas --check
    kind: external
    verifies: format-fantomas
    surfaces:
      ci: { scope: affected-file-type, glob: "*.fs" }

  - id: format-ruff
    type: mutation
    category: formatter
    command: ruff format
    kind: external
    restages: true
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.py" }

  - id: format-verify-ruff
    type: check
    command: ruff format --check
    kind: external
    verifies: format-ruff
    surfaces:
      ci: { scope: affected-file-type, glob: "*.py" }

  - id: format-shfmt
    type: mutation
    category: formatter
    command: shfmt -w
    kind: external
    restages: true
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.sh" }

  - id: format-verify-shfmt
    type: check
    command: shfmt -d
    kind: external
    verifies: format-shfmt
    surfaces:
      ci: { scope: affected-file-type, glob: "*.sh" }

  # -------------------------------------------------- per-file checks (12)
  - id: markdownlint
    type: check
    command: markdownlint-cli2
    kind: external
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.md" }
      ci: { scope: all-file-type }

  - id: md-mermaid
    type: check
    command: md mermaid validate
    kind: rhino-cli
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.md" }
      ci: { scope: all-file-type }

  - id: md-heading-hierarchy
    type: check
    command: md heading-hierarchy validate
    kind: rhino-cli
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.md" }
      ci: { scope: all-file-type }

  - id: md-naming
    type: check
    command: md naming validate
    kind: rhino-cli
    args:
      exempt:
        - "*__linkedin__*.md"
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.md" }
      ci: { scope: all-file-type }

  - id: md-frontmatter
    type: check
    command: md frontmatter validate
    kind: rhino-cli
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.md" }
      ci: { scope: all-file-type }

  - id: actionlint
    type: check
    command: actionlint
    kind: external
    surfaces:
      pre-commit:
        scope: affected-file-type
        glob: ".github/workflows/*.{yml,yaml}"
      ci: { scope: all-file-type }

  - id: shellcheck
    type: check
    command: shellcheck --severity=warning
    kind: external
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.sh" }
      ci: { scope: affected-file-type, glob: "*.sh" }

  - id: hadolint
    type: check
    command: hadolint --failure-threshold warning
    kind: external
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "**/Dockerfile*" }
      ci: { scope: affected-file-type, glob: "**/Dockerfile*" }

  - id: convention-emoji
    type: check
    command: convention emoji validate
    kind: rhino-cli
    surfaces:
      pre-commit:
        scope: affected-file-type
        glob: "*.{json,toml,ts,tsx,js,jsx,mjs,cjs,rs,go,py,cs,clj,dart,ex,exs,fs}"
      ci: { scope: all-file-type }

  - id: specs-gherkin-cardinality
    type: check
    command: specs gherkin-cardinality validate
    kind: rhino-cli
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.feature" }
      ci: { scope: all-file-type }

  - id: docker-compose-config
    type: check
    command: docker compose config
    kind: external
    surfaces:
      pre-commit:
        scope: affected-file-type
        glob: "docker-compose*.{yml,yaml}"
        lint-staged-shell: 'for f; do docker compose -f "$f" config > /dev/null; done'
      ci: { scope: all-file-type }

  # ------------------------------------- pre-commit mutations, run last (order)
  - id: harness-bindings-generate
    type: mutation
    command: harness bindings generate
    kind: rhino-cli
    restages: true
    surfaces:
      pre-commit: { scope: other }

  - id: lockfile-sync
    type: mutation
    command: git lockfile sync
    kind: rhino-cli
    restages: true
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "apps/*/package.json" }

  # ------------------------------------------------------ pre-push + ci checks
  - id: test-quick
    type: check
    command: "test:quick"
    kind: nx
    wiring: hand-wired
    surfaces:
      pre-push: { scope: affected-projects }
      ci: { scope: affected-projects }

  - id: compat-min-version
    type: check
    command: "compat:min-version"
    kind: nx
    wiring: hand-wired
    surfaces:
      pre-push: { scope: affected-projects }
      ci: { scope: affected-projects }

  - id: specs-structure
    type: check
    command: "specs:structure-validation"
    kind: nx
    wiring: hand-wired
    surfaces:
      pre-push: { scope: affected-projects }
      ci: { scope: affected-projects }

  - id: env-validate
    type: check
    command: env validate
    kind: rhino-cli
    surfaces:
      pre-push: { scope: other }
      ci: { scope: other }

  - id: md-links
    type: check
    command: md links validate
    kind: rhino-cli
    args:
      exclude:
        - plans/done
    surfaces:
      pre-push: { scope: all-file-type }
      ci: { scope: all-file-type }

  - id: md-readme-index
    type: check
    command: md readme-index validate
    kind: rhino-cli
    surfaces:
      pre-push: { scope: all-file-type }
      ci: { scope: all-file-type }

  - id: harness-duplication
    type: check
    command: harness duplication validate
    kind: rhino-cli
    surfaces:
      pre-push: { scope: all-file-type }
      ci: { scope: all-file-type }

  - id: parity-manifest
    type: check
    command: parity manifest validate
    kind: rhino-cli
    surfaces:
      pre-push: { scope: other }
      ci: { scope: other }

  # --------------------------------------------- path-gated governance checks
  - id: harness-naming
    type: check
    command: harness naming validate
    kind: rhino-cli
    surfaces:
      pre-push:
        scope: path-gated
        trigger:
          - .claude/agents/
          - .opencode/agents/
      ci: { scope: other }

  - id: workflows-naming
    type: check
    command: repo-governance workflows naming validate
    kind: rhino-cli
    surfaces:
      pre-push:
        scope: path-gated
        trigger:
          - repo-governance/workflows/
      ci: { scope: other }

  - id: vendor-independence
    type: check
    command: repo-governance vendor validate repo-governance/
    kind: rhino-cli
    surfaces:
      pre-push:
        scope: path-gated
        trigger:
          - repo-governance/
      ci: { scope: other }

  - id: convention-license
    type: check
    command: convention license validate
    kind: rhino-cli
    surfaces:
      pre-push:
        scope: path-gated
        trigger:
          - repo-governance/
      ci: { scope: other }

  - id: harness-bindings
    type: check
    command: harness bindings validate
    kind: rhino-cli
    surfaces:
      pre-push:
        scope: path-gated
        trigger:
          - .amazonq/
          - .claude/
          - .opencode/
          - .codex/
          - .cursor/
          - .windsurf/
          - .junie/
          - .github/
          - AGENTS.md
          - CLAUDE.md
          - GEMINI.md
          - CONVENTIONS.md
          - docs/reference/platform-bindings.md
          - repo-governance/
      ci: { scope: other }

  - id: instruction-size
    type: check
    command: harness instruction-size validate
    kind: rhino-cli
    surfaces:
      pre-push:
        scope: path-gated
        trigger:
          - AGENTS.md
          - CLAUDE.md
          - repo-config.yml
          - .amazonq/rules/
          - .windsurf/rules/
          - .cursor/rules/
          - .junie/guidelines.md
          - .github/copilot-instructions.md
          - CONVENTIONS.md
      ci: { scope: other }
