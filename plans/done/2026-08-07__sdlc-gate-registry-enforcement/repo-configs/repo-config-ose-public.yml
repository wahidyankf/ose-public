# TARGET STATE — do not copy this banner into the repo.
#
# This is the COMPLETE repo-config.yml as it should look in ose-public AFTER the
# sdlc-gate-registry-enforcement plan lands. Everything above the `gates:`
# section is this repo's CURRENT YAML content, reproduced verbatim as of
# 2026-08-02. This plan also corrects the stale header below and adds the
# `gates:` section at the end.
#
# Before copying, re-verify the unchanged part still matches:
#   diff <(sed -n '/^harness:/,/^gates:/p' <this file> | sed '$d' | sed '$d') \
#        <(sed -n '/^harness:/,$p' ose-public/repo-config.yml)
# The range compares existing YAML while excluding this banner, the deliberately
# corrected header, and the new `gates:` section.
# A non-empty diff means another change landed since 2026-08-02 — reconcile
# rather than overwrite.
#
# repo-config.yml — schema: rhino-cli/repo-config/v1
#
# Unified repository configuration. All four OSE repositories share the same
# rhino-cli schema; section presence and values reflect each repo's actual project
# set and surfaces. rhino-cli commands read their relevant section.
#
# Sections defined here:
#   harness          — all-harness binding registry (§3.2); EVERY `harness` command reads this list
#   coverage         — per-project test-level registry (specs:behavior:coverage + specs:domain:coverage)
#   specs            — spec-tree structure config (specs:structure-validation)
#   instruction-size — per-surface instruction-file byte budgets (rhino-cli harness instruction-size validate)
#   env-contract     — surface registry for rhino-cli env validate (code↔config drift detection)
#   env-injection    — value-less injection manifest for rhino-cli env validate (manifest-consistency)
#   doctor           — tool exclusions and the optional .NET SDK version source (rhino-cli doctor)
#   gates            — executable SDLC gate registry and per-surface composition data

harness:
  # Authoritative harness registry — all 11 supported coding-agent harnesses.
  # Fields per entry:
  #   name        — harness identifier
  #   tier        — source | generated | source-config | native
  #   agent-dir   — directory of per-agent files (naming/duplication checks)
  #   skills-dir  — directory of skill files (source tier only)
  #   rules-dir   — directory of injected rules (generated tier only)
  #   agent-name  — generated Amazon Q agent-definition filename stem and embedded name (amazonq only)
  #   mirrors     — source agent-dir this entry must mirror (generated tier)
  #   config      — config file path (source-config tier)
  #   forbid-dir  — directory that must NOT exist (source-config tier)
  #   shadow      — thin-pointer file to check for no-shadowing (native tier)
  #   instruction — instruction surfaces this harness reads (instruction-size budget)
  #
  # Adding a 12th harness = one entry here; every harness command picks it up automatically.
  - { name: claude-code, tier: source, agent-dir: .claude/agents, skills-dir: .claude/skills, instruction: [CLAUDE.md] }
  - { name: opencode, tier: generated, agent-dir: .opencode/agents, mirrors: .claude/agents }
  - name: amazonq
    tier: generated
    rules-dir: .amazonq/rules
    agent-name: ose-default
    instruction:
      - .amazonq/rules/*.md
  - name: codex
    tier: source-config
    config: .codex/config.toml
    forbid-dir: .codex/agents
    instruction:
      - AGENTS.md
  - {
      name: copilot,
      tier: native,
      shadow: .github/copilot-instructions.md,
      instruction: [AGENTS.md, .github/copilot-instructions.md],
    }
  - name: cursor
    tier: generated
    agent-dir: .cursor/agents
    mirrors: .claude/agents
    shadow: .cursor/rules
    instruction: [AGENTS.md, .cursor/rules]
  - { name: windsurf, tier: native, shadow: .windsurf/rules, instruction: [AGENTS.md, .windsurf/rules] }
  - { name: junie, tier: native, shadow: .junie/guidelines.md, instruction: [AGENTS.md, .junie/guidelines.md] }
  - { name: antigravity, tier: native, shadow: GEMINI.md, instruction: [AGENTS.md, GEMINI.md] }
  - { name: pi, tier: native, instruction: [AGENTS.md, CLAUDE.md] }
  - { name: aider, tier: native, shadow: CONVENTIONS.md, instruction: [AGENTS.md, CONVENTIONS.md] }

coverage:
  # Explicit per-project test-level registry. One entry per Nx project (apps,
  # libs, *-e2e). No convention-derived defaults — every project is listed.
  # A scenario's level envelope P = union of `levels` across ALL entries whose
  # `specs` glob matches that scenario's feature file.
  # `levels` = the test levels this project runs at.
  # `specs`  = the feature-file glob this project owns (surface-precise for apps;
  #             per-project for libs).
  projects:
    # rhino-cli (tooling)
    - name: rhino-cli
      levels: [unit, integration]
      specs: "specs/apps/rhino/behavior/rhino-cli/**"

    # ose domain
    - name: ose-be
      levels: [unit, integration]
      specs: "specs/apps/ose/behavior/be/**"
    - name: ose-be-e2e
      levels: [e2e]
      specs: "specs/apps/ose/behavior/be/**"
    - name: ose-app-web
      levels: [unit]
      specs: "specs/apps/ose/behavior/app-web/**"
    - name: ose-app-web-e2e
      levels: [e2e]
      specs: "specs/apps/ose/behavior/app-web/**"
    - name: ose-www
      levels: [unit]
      specs: "specs/apps/ose/behavior/www/**"
    - name: ose-www-be-e2e
      levels: [e2e]
      specs: "specs/apps/ose/behavior/www/**"
    - name: ose-www-fe-e2e
      levels: [e2e]
      specs: "specs/apps/ose/behavior/www/**"
    - name: ose-cli
      levels: [unit, integration]
      specs: "specs/apps/ose/behavior/cli/**"

    # organiclever domain
    - name: organiclever-be
      levels: [unit, integration]
      specs: "specs/apps/organiclever/behavior/be/**"
    - name: organiclever-be-e2e
      levels: [e2e]
      specs: "specs/apps/organiclever/behavior/be/**"
    - name: organiclever-app-web
      levels: [unit]
      specs: "specs/apps/organiclever/behavior/app-web/**"
    - name: organiclever-app-web-e2e
      levels: [e2e]
      specs: "specs/apps/organiclever/behavior/app-web/**"
    - name: organiclever-www
      levels: [unit]
      specs: "specs/apps/organiclever/behavior/www/**"
    - name: organiclever-www-be-e2e
      levels: [e2e]
      specs: "specs/apps/organiclever/behavior/www/**"
    - name: organiclever-www-fe-e2e
      levels: [e2e]
      specs: "specs/apps/organiclever/behavior/www/**"

    # ayokoding domain
    - name: ayokoding-www
      levels: [unit]
      specs: "specs/apps/ayokoding/behavior/www/**"
    - name: ayokoding-www-be-e2e
      levels: [e2e]
      specs: "specs/apps/ayokoding/behavior/www/**"
    - name: ayokoding-www-fe-e2e
      levels: [e2e]
      specs: "specs/apps/ayokoding/behavior/www/**"
    - name: ayokoding-cli
      levels: [unit, integration]
      specs: "specs/apps/ayokoding/behavior/cli/**"

    # wahidyankf domain
    - name: wahidyankf-www
      levels: [unit]
      specs: "specs/apps/wahidyankf/behavior/www/**"
    - name: wahidyankf-www-fe-e2e
      levels: [e2e]
      specs: "specs/apps/wahidyankf/behavior/www/**"

    # crane domain
    - name: crane-cli
      levels: [unit, integration]
      specs: "specs/apps/crane/behavior/cli/**"

    # libs
    - name: rust-commons
      levels: [unit]
      specs: "specs/libs/rust-commons/behavior/**"
    - name: web-ui
      levels: [unit]
      specs: "specs/libs/web-ui/behavior/**"
    - name: fsharp-crane-core
      levels: [unit]
      specs: "specs/libs/fsharp-crane-core/behavior/**"

    # Deliberately excluded, not omitted-by-oversight (Phase 2 closeout, 2026-07-02):
    #   web-ui-token, organiclever-contracts, ose-contracts — every test-level target
    #   (test:unit/test:integration/test:e2e) is a documented no-op
    #   ("target not applicable for this project") for these 3 projects; their real
    #   quality gate is typecheck (web-ui-token) or lint/bundle — OpenAPI spectral
    #   linting (the 2 *-contracts projects) — not a Gherkin-driven test level this
    #   registry models. Adding a levels: [] or levels: [unit] entry here would
    #   misleadingly claim behavior-spec coverage that doesn't exist.

specs:
  # Areas that must carry a ddd/ folder (bounded-context registry). Lifts the
  # hardcoded apps_with_ddd() allowlist into explicit config.
  # An area NOT listed must NOT carry ddd/ (unlisted area with ddd/ = error).
  ddd-areas:
    - organiclever
    - ose

  # Areas eligible for specs:domain:coverage (explicit allowlist; distinct from
  # ddd-areas). A project NOT listed is skipped even if it has domain/** features.
  # Today: the *-be backends that own domain-bounded-context feature files.
  domain-areas:
    - organiclever-be
    - ose-be

instruction-size:
  surfaces:
    - glob: "AGENTS.md"
      target: 24000
      warn: 27000
      fail: 30000
    - glob: "**/AGENTS.md"
      target: 24000
      warn: 27000
      fail: 30000
    - glob: "CLAUDE.md"
      target: 6000
      warn: 8000
      fail: 10000
    - glob: ".amazonq/rules/*.md"
      target: 4000
      warn: 8000
      fail: 12000
    - glob: ".windsurf/rules/*.md"
      target: 6000
      warn: 9000
      fail: 12000
    - glob: ".cursor/rules/*.mdc"
      target: 4000
      warn: 8000
      fail: 12000
    - glob: ".junie/guidelines.md"
      target: 6000
      warn: 8000
      fail: 10000
    - glob: ".github/copilot-instructions.md"
      target: 6000
      warn: 8000
      fail: 10000
    - glob: "CONVENTIONS.md"
      target: 10000
      warn: 13000
      fail: 16000
  resolved_tree:
    root: "CLAUDE.md"
    target: 30000
    warn: 34000
    fail: 38000

env-contract:
  # Surface registry for rhino-cli env validate (code↔config drift detection).
  # Companion: env-injection: declares, per app, the injection HOME for each key
  # at every deploy stage (names only, never values).
  #
  # Each surface entry carries:
  #   root      — path relative to repo root
  #   kind      — "app" (active); "terraform"/"ansible" are forward-scaffold
  #   lang      — "rust" or "typescript" (app kind only)
  #   allowlist — keys exempt from drift detection (framework-injected, test-only, etc.)
  surfaces:
    - root: apps/organiclever-be
      kind: app
      lang: fsharp
      allowlist:
        # Forward-declared config not yet consumed by the Phase 1 F# shell
        # (wired in later phases); declared in .env.example ahead of use.
        - ORGANICLEVER_BE_PORT
        - ORGANICLEVER_BE_CORS_ORIGINS

    - root: apps/ose-be
      kind: app
      lang: fsharp
      allowlist:
        # Forward-declared config not yet consumed by the Phase 1 F# shell
        # (port/CORS + OpenRouter wired in later phases); declared ahead of use.
        - OSE_BE_PORT
        - OSE_BE_CORS_ORIGINS
        - OSE_BE_OPENROUTER_API_KEY
        - OSE_BE_OPENROUTER_MODEL
        - OSE_BE_OPENROUTER_BASE_URL

    - root: apps/ose-www
      kind: app
      lang: typescript
      allowlist:
        - PORT # framework-reserved Next.js dev-server port
        - HOSTNAME # framework-reserved Next.js dev-server hostname

    - root: apps/ayokoding-www
      kind: app
      lang: typescript
      allowlist:
        - PORT
        - HOSTNAME
        - NODE_ENV # Node-reserved; read by static client-data refresh test guard

    - root: apps/organiclever-www
      kind: app
      lang: typescript
      allowlist:
        - PORT # framework-reserved Next.js dev-server port
        - HOSTNAME # framework-reserved Next.js dev-server hostname

    - root: apps/organiclever-app-web
      kind: app
      lang: typescript
      allowlist:
        - PORT
        - HOSTNAME

    - root: apps/ose-app-web
      kind: app
      lang: typescript
      allowlist:
        - PORT
        - HOSTNAME

    - root: apps/wahidyankf-www
      kind: app
      lang: typescript
      allowlist:
        - PORT
        - HOSTNAME

env-injection:
  # Value-less injection contract (extends env-contract:).
  # Declares, per app, the injection HOME for its env keys at every deploy stage
  # it runs in — NAMES ONLY, never values.
  #
  # Injection homes:
  #   env-local         — gitignored apps/<app>/.env.local (developer machine)
  #   compose           — infra/dev/<stack> docker-compose env (local CI), placeholders only
  #   vercel-preview     — Vercel project env, Preview scope (stag-*-app-web branch)
  #   vercel-production  — Vercel project env, Production scope (prod-*-www / prod-*-app-web)
  #   k3s-coralpolyp     — private-sibling coralpolyp secret store (backend k3s rollout)
  apps:
    # --- www tier (direct-to-prod; e2e runs on local compose) ---
    - app: ose-www
      keys-from: apps/ose-www/.env.example
      runtime: { local: env-local, local-ci: compose, production: vercel-production }
    - app: ayokoding-www
      keys-from: apps/ayokoding-www/.env.example
      runtime: { local: env-local, local-ci: compose, production: vercel-production }
    - app: organiclever-www
      keys-from: apps/organiclever-www/.env.example
      runtime: { local: env-local, local-ci: compose, production: vercel-production }
    - app: wahidyankf-www
      keys-from: apps/wahidyankf-www/.env.example
      runtime: { local: env-local, local-ci: compose, production: vercel-production }

    # --- app-web tier (gated staging promotion) ---
    - app: organiclever-app-web
      keys-from: apps/organiclever-app-web/.env.example
      runtime: { local: env-local, local-ci: compose, staging: vercel-preview, production: vercel-production }
    - app: ose-app-web
      keys-from: apps/ose-app-web/.env.example
      runtime: { local: env-local, local-ci: compose, staging: vercel-preview, production: vercel-production }

    # --- backend tier (non-Vercel; k3s via private-sibling coralpolyp) ---
    - app: organiclever-be
      keys-from: apps/organiclever-be/.env.example
      runtime: { local-ci: compose, staging: k3s-coralpolyp }
    - app: ose-be
      keys-from: apps/ose-be/.env.example
      runtime: { local-ci: compose, staging: k3s-coralpolyp }

  # CI test-harness keys — test-only, NEVER in any apps/<app>/.env.example.
  ci-harness:
    - key: API_BASE_URL
      class: var
      environments: [organiclever-app-staging, ose-app-staging]
    - key: WEB_BASE_URL
      class: var
      environments: [organiclever-app-staging, ose-app-staging]
    - key: VERCEL_AUTOMATION_BYPASS_SECRET
      class: secret
      environments: [organiclever-app-staging, ose-app-staging]
    - key: PLAYWRIGHT_GREP_INVERT
      class: literal
      environments: []

doctor:
  dotnet-global-json: apps/ose-be/global.json

gates:
  # ---------------------------------------------------------------- commit-msg
  - id: commitlint
    type: check
    command: 'npx --no -- commitlint --edit "$1"'
    kind: external
    surfaces:
      commit-msg: { scope: other }

  # -------------------------------------------- pre-commit: guards before work
  - id: env-staged-guard
    type: check
    command: env staged-guard validate
    kind: rhino-cli
    carve-out: staged-only
    surfaces:
      pre-commit: { scope: other }

  - id: repo-config-schema
    type: check
    command: repo-config validate
    kind: rhino-cli
    surfaces:
      pre-commit:
        scope: affected-file-type
        glob: repo-config.yml
        lint-staged-shell: "{{command}}"
      ci: { scope: other }

  # ----------------------------------------------- formatters (13 mutations) +
  # ----------------------------------------------- their ci verifiers (13 checks)
  - id: format-prettier
    type: mutation
    category: formatter
    command: prettier --write
    kind: external
    restages: true
    surfaces:
      pre-commit:
        scope: affected-file-type
        globs:
          - "*.md"
          - "*.{js,jsx,ts,tsx,mjs,cjs}"
          - "*.json"
          - "*.{yml,yaml}"
          - "*.{css,scss}"
          - "*.html"
          - "*.sql"

  - id: format-verify-prettier
    type: check
    command: prettier --check
    kind: external
    verifies: format-prettier
    surfaces:
      ci:
        scope: affected-file-type
        glob: "*.{md,json,yml,yaml,css,scss,html,sql,ts,tsx,js,jsx,mjs,cjs}"

  - id: format-rustfmt
    type: mutation
    category: formatter
    command: rustfmt --edition 2024
    kind: external
    restages: true
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.rs" }

  - id: format-verify-rustfmt
    type: check
    command: rustfmt --edition 2024 --check
    kind: external
    verifies: format-rustfmt
    surfaces:
      ci: { scope: affected-file-type, glob: "*.rs" }

  - id: format-fantomas
    type: mutation
    category: formatter
    command: fantomas
    kind: external
    restages: true
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.fs" }

  - id: format-verify-fantomas
    type: check
    # Fantomas exits 99 (not 1) when files need formatting; 1 means an unexpected
    # error. Any non-zero must fail the gate — never test for exit code 1 alone.
    # Bare `fantomas` requires a GLOBAL dotnet tool install; a local manifest
    # install needs `dotnet fantomas`. Phase 0 confirms which this repo uses.
    command: fantomas --check
    kind: external
    verifies: format-fantomas
    surfaces:
      ci: { scope: affected-file-type, glob: "*.fs" }

  - id: format-ruff
    type: mutation
    category: formatter
    command: ruff format
    kind: external
    restages: true
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.py" }

  - id: format-verify-ruff
    type: check
    command: ruff format --check
    kind: external
    verifies: format-ruff
    surfaces:
      ci: { scope: affected-file-type, glob: "*.py" }

  - id: format-gofmt
    type: mutation
    category: formatter
    command: gofmt -w
    kind: external
    restages: true
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.go" }

  - id: format-verify-gofmt
    type: check
    # `gofmt -l` always exits 0; the wrapper converts non-empty output to failure.
    command: scripts/verify-gofmt.sh
    kind: external
    verifies: format-gofmt
    surfaces:
      ci: { scope: affected-file-type, glob: "*.go" }

  - id: format-elixir
    type: mutation
    category: formatter
    command: scripts/format-elixir.sh
    kind: external
    restages: true
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.{ex,exs}" }

  - id: format-verify-elixir
    type: check
    # The wrapper discovers each mix project; do not add --no-exit.
    command: scripts/format-elixir.sh --check
    kind: external
    verifies: format-elixir
    surfaces:
      ci: { scope: affected-file-type, glob: "*.{ex,exs}" }

  - id: format-csharpier
    type: mutation
    category: formatter
    command: dotnet csharpier format
    kind: external
    restages: true
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.cs" }

  - id: format-verify-csharpier
    type: check
    # `check` fails on unformatted files; do not use `--unformatted-as-warnings`.
    command: dotnet csharpier check
    kind: external
    verifies: format-csharpier
    surfaces:
      ci: { scope: affected-file-type, glob: "*.cs" }

  - id: format-dart
    type: mutation
    category: formatter
    command: dart format
    kind: external
    restages: true
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.dart" }

  - id: format-verify-dart
    type: check
    # `-o none` prevents the verifier from rewriting files before it fails.
    command: dart format -o none --set-exit-if-changed
    kind: external
    verifies: format-dart
    surfaces:
      ci: { scope: affected-file-type, glob: "*.dart" }

  - id: format-shfmt
    type: mutation
    category: formatter
    command: shfmt -w
    kind: external
    restages: true
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.sh" }

  - id: format-verify-shfmt
    type: check
    command: shfmt -d
    kind: external
    verifies: format-shfmt
    surfaces:
      ci: { scope: affected-file-type, glob: "*.sh" }

  - id: format-tofu
    type: mutation
    category: formatter
    command: tofu fmt
    kind: external
    restages: true
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.tf" }

  - id: format-verify-tofu
    type: check
    command: tofu fmt -check
    kind: external
    verifies: format-tofu
    surfaces:
      ci: { scope: affected-file-type, glob: "*.tf" }

  - id: format-stylua
    type: mutation
    category: formatter
    command: stylua
    kind: external
    restages: true
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.lua" }

  - id: format-verify-stylua
    type: check
    command: stylua --check
    kind: external
    verifies: format-stylua
    surfaces:
      ci: { scope: affected-file-type, glob: "*.lua" }

  - id: format-clang
    type: mutation
    category: formatter
    command: clang-format -i
    kind: external
    restages: true
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.{c,h}" }

  - id: format-verify-clang
    type: check
    # --Werror is double-dash per LLVM docs; it promotes the
    # "code should be clang-formatted" warning to an error so the exit is non-zero.
    command: clang-format --dry-run --Werror
    kind: external
    verifies: format-clang
    surfaces:
      ci: { scope: affected-file-type, glob: "*.{c,h}" }

  - id: format-buildifier
    type: mutation
    category: formatter
    command: buildifier
    kind: external
    restages: true
    surfaces:
      pre-commit:
        scope: affected-file-type
        glob: "{BUILD,BUILD.bazel,*.bzl}"

  - id: format-verify-buildifier
    type: check
    command: buildifier --mode=check
    kind: external
    verifies: format-buildifier
    surfaces:
      ci:
        scope: affected-file-type
        glob: "{BUILD,BUILD.bazel,*.bzl}"

  # -------------------------------------------------- per-file checks (12)
  - id: markdownlint
    type: check
    command: markdownlint-cli2
    kind: external
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.md" }
      ci: { scope: all-file-type }

  - id: md-mermaid
    type: check
    command: md mermaid validate
    kind: rhino-cli
    args:
      exclude:
        - apps/rhino-cli/tests/fixtures
        - plans/done
        - apps/ayokoding-www/content
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.md" }
      ci: { scope: all-file-type }

  - id: md-heading-hierarchy
    type: check
    command: md heading-hierarchy validate
    kind: rhino-cli
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.md" }
      ci: { scope: all-file-type }

  - id: md-naming
    type: check
    command: md naming validate
    kind: rhino-cli
    args:
      exempt:
        - "*__linkedin__*.md"
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.md" }
      ci: { scope: all-file-type }

  - id: md-frontmatter
    type: check
    command: md frontmatter validate
    kind: rhino-cli
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.md" }
      ci: { scope: all-file-type }

  - id: actionlint
    type: check
    command: actionlint
    kind: external
    surfaces:
      pre-commit:
        scope: affected-file-type
        glob: ".github/workflows/*.{yml,yaml}"
      ci: { scope: all-file-type }

  - id: shellcheck
    type: check
    command: shellcheck --severity=warning
    kind: external
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.sh" }
      ci: { scope: affected-file-type, glob: "*.sh" }

  - id: hadolint
    type: check
    command: hadolint --failure-threshold warning
    kind: external
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "**/Dockerfile*" }
      ci: { scope: affected-file-type, glob: "**/Dockerfile*" }

  - id: convention-emoji
    type: check
    command: convention emoji validate
    kind: rhino-cli
    surfaces:
      pre-commit:
        scope: affected-file-type
        glob: "*.{json,toml,ts,tsx,js,jsx,mjs,cjs,rs,go,py,cs,clj,dart,ex,exs,fs}"
      ci: { scope: all-file-type }

  - id: specs-gherkin-cardinality
    type: check
    command: specs gherkin-cardinality validate
    kind: rhino-cli
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "*.feature" }
      ci: { scope: all-file-type }

  - id: docker-compose-config
    type: check
    command: 'sh -ec ''for f; do base=${f%.ci.yml}.yml; if [ "$base" != "$f" ] && [ -f "$base" ]; then docker compose -f "$base" -f "$f" config > /dev/null; else docker compose -f "$f" config > /dev/null; fi; done'' --'
    kind: external
    surfaces:
      pre-commit:
        scope: affected-file-type
        glob: "docker-compose*.{yml,yaml}"
        lint-staged-shell: 'set -e; for f; do base=${f%.ci.yml}.yml; if [ "$base" != "$f" ] && [ -f "$base" ]; then docker compose -f "$base" -f "$f" config > /dev/null; else docker compose -f "$f" config > /dev/null; fi; done'
      ci:
        scope: all-file-type
        globs:
          - "**/docker-compose*.yml"
          - "**/docker-compose*.yaml"

  # ------------------------------------- pre-commit mutations, run last (order)
  - id: harness-bindings-generate
    type: mutation
    command: harness bindings generate
    kind: rhino-cli
    restages: true
    surfaces:
      pre-commit: { scope: other }

  - id: lockfile-sync
    type: mutation
    command: git lockfile sync
    kind: rhino-cli
    restages: true
    surfaces:
      pre-commit: { scope: affected-file-type, glob: "apps/*/package.json" }

  # ------------------------------------------------------ pre-push + ci checks
  - id: test-quick
    type: check
    command: "test:quick"
    kind: nx
    wiring: hand-wired
    surfaces:
      pre-push: { scope: affected-projects }
      ci: { scope: affected-projects }

  - id: compat-min-version
    type: check
    command: "compat:min-version"
    kind: nx
    wiring: hand-wired
    surfaces:
      pre-push: { scope: affected-projects }
      ci: { scope: affected-projects }

  - id: specs-structure
    type: check
    command: "specs:structure-validation"
    kind: nx
    wiring: hand-wired
    surfaces:
      pre-push: { scope: affected-projects }
      ci: { scope: affected-projects }

  - id: env-validate
    type: check
    command: env validate
    kind: rhino-cli
    surfaces:
      pre-push: { scope: other }
      ci: { scope: other }

  - id: md-links
    type: check
    command: md links validate
    kind: rhino-cli
    args:
      exclude:
        - plans/done
        - apps/ayokoding-www/content
        - apps/ose-www/content
    surfaces:
      pre-push: { scope: all-file-type }
      ci: { scope: all-file-type }

  - id: md-readme-index
    type: check
    command: md readme-index validate
    kind: rhino-cli
    surfaces:
      pre-push: { scope: all-file-type }
      ci: { scope: all-file-type }

  - id: harness-duplication
    type: check
    command: harness duplication validate
    kind: rhino-cli
    surfaces:
      pre-push: { scope: all-file-type }
      ci: { scope: all-file-type }

  - id: parity-manifest
    type: check
    command: parity manifest validate
    kind: rhino-cli
    surfaces:
      pre-push: { scope: other }
      ci: { scope: other }

  # --------------------------------------------- path-gated governance checks
  - id: harness-naming
    type: check
    command: harness naming validate
    kind: rhino-cli
    surfaces:
      pre-push:
        scope: path-gated
        trigger:
          - .claude/agents/
          - .opencode/agents/
      ci: { scope: other }

  - id: workflows-naming
    type: check
    command: repo-governance workflows naming validate
    kind: rhino-cli
    surfaces:
      pre-push:
        scope: path-gated
        trigger:
          - repo-governance/workflows/
      ci: { scope: other }

  - id: vendor-independence
    type: check
    command: repo-governance vendor validate repo-governance/
    kind: rhino-cli
    surfaces:
      pre-push:
        scope: path-gated
        trigger:
          - repo-governance/
      ci: { scope: other }

  - id: convention-license
    type: check
    command: convention license validate
    kind: rhino-cli
    surfaces:
      pre-push:
        scope: path-gated
        trigger:
          - repo-governance/
      ci: { scope: other }

  - id: harness-bindings
    type: check
    command: harness bindings validate
    kind: rhino-cli
    surfaces:
      pre-push:
        scope: path-gated
        trigger:
          - .amazonq/
          - .claude/
          - .opencode/
          - .codex/
          - .cursor/
          - .windsurf/
          - .junie/
          - .github/
          - AGENTS.md
          - CLAUDE.md
          - GEMINI.md
          - CONVENTIONS.md
          - docs/reference/platform-bindings.md
          - repo-governance/
      ci: { scope: other }

  - id: instruction-size
    type: check
    command: harness instruction-size validate
    kind: rhino-cli
    surfaces:
      pre-push:
        scope: path-gated
        trigger:
          - AGENTS.md
          - CLAUDE.md
          - repo-config.yml
          - .amazonq/rules/
          - .windsurf/rules/
          - .cursor/rules/
          - .junie/guidelines.md
          - .github/copilot-instructions.md
          - CONVENTIONS.md
      ci: { scope: other }
