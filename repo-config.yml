environment:
  examples:
    - { source: apps/ayokoding-www/.env.example, target: apps/ayokoding-www/.env.local }
    - { source: apps/organiclever-app-web/.env.example, target: apps/organiclever-app-web/.env.local }
    - { source: apps/organiclever-be/.env.example, target: apps/organiclever-be/.env.local }
    - { source: apps/organiclever-www/.env.example, target: apps/organiclever-www/.env.local }
    - { source: apps/ose-app-web/.env.example, target: apps/ose-app-web/.env.local }
    - { source: apps/ose-be/.env.example, target: apps/ose-be/.env.local }
    - { source: apps/ose-id-be/.env.example, target: apps/ose-id-be/.env.local }
    - { source: apps/ose-id-web/.env.example, target: apps/ose-id-web/.env.local }
    - { source: apps/ose-lms-be/.env.example, target: apps/ose-lms-be/.env.local }
    - { source: apps/ose-www/.env.example, target: apps/ose-www/.env.local }
    - { source: apps/roots-be/.env.example, target: apps/roots-be/.env.local }
  staged:
    forbidden: [".env*", "**/.env*"]
    allowed:
      - apps/ayokoding-www/.env.example
      - apps/ayokoding-www/content/en/learn/courses/cicd-and-release-engineering/.env.example
      - apps/ayokoding-www/content/en/learn/courses/containers-and-orchestration/learning/capstone/.env.example
      - apps/ayokoding-www/content/en/learn/courses/containers-and-orchestration/learning/code/ex-34-compose-db-cache/.env.example
      - apps/organiclever-app-web/.env.example
      - apps/organiclever-be/.env.example
      - apps/organiclever-www/.env.example
      - apps/ose-app-web/.env.example
      - apps/ose-be/.env.example
      - apps/ose-id-be/.env.example
      - apps/ose-id-web/.env.example
      - apps/ose-lms-be/.env.example
      - apps/ose-www/.env.example
      - apps/roots-be/.env.example
  contracts:
    - path: apps/ayokoding-www/.env.example
      keys: [AYOKODING_WEB_CONTENT_DIR, AYOKODING_WEB_SHOW_DRAFTS, AYOKODING_WEB_MANIFESTS_DIR]
    - path: apps/organiclever-app-web/.env.example
      keys: [ORGANICLEVER_BE_URL]
    - path: apps/ose-id-web/.env.example
      keys: [OSE_RUNTIME_MODE, OSE_ID_WEB_PORT, OSE_ID_BE_URL]
    - path: apps/ose-www/.env.example
      keys: [OSE_WEB_CONTENT_DIR, OSE_WEB_SEARCH_DATA_PATH, OSE_WEB_SHOW_DRAFTS]
    - path: apps/roots-be/.env.example
      keys: [ROOTS_BE_PORT]
  detectors:
    - language: type-script
      paths:
        - apps/ayokoding-www/src/env.ts
        - apps/organiclever-app-web/src/env.ts
        - apps/ose-id-web/src/env.ts
        - apps/ose-www/src/env.ts
    - language: go
      paths: [apps/roots-be/cmd/roots-be/main.go]

toolchains:
  entries:
    - { id: git, executable: git, probe: [--version], required: true }
    - { id: volta, executable: volta, probe: [--version], required: true }
    - { id: node, executable: node, probe: [--version], required: true }
    - { id: npm, executable: npm, probe: [--version], required: true }
    - { id: dotnet, executable: dotnet, probe: [--version], required: true }
    - { id: go, executable: go, probe: [version], required: true }
    - { id: golangci-lint, executable: golangci-lint, probe: [version], required: true }
    - { id: java, executable: java, probe: [--version], required: true }
    - { id: docker, executable: docker, probe: [--version], required: true }
    - { id: jq, executable: jq, probe: [--version], required: true }
    # Native binaries the declared gates below invoke from PATH: `bash` runs every gate script,
    # `curl` fetches the pinned ./rhino, ./hippo, and public-safety scanner releases on a cold
    # cache, the formatters are those `scripts/format-staged` calls per staged extension, and
    # `shellcheck`, `hadolint`, and `actionlint` back the three lint gates (`actionlint` also runs
    # `shellcheck` over every workflow `run:` block).
    # Deliberately undeclared, per the cross-language lint-strictness policy: npm-lockfile tools
    # (prettier, markdownlint-cli2, stylua, buildifier), `gofmt` and `npx` (shipped with go and
    # npm), Gradle (projects run their own wrapper), the digest-pinned scanner, base utilities.
    - { id: bash, executable: bash, probe: [--version], required: true }
    - { id: curl, executable: curl, probe: [--version], required: true }
    - { id: rustfmt, executable: rustfmt, probe: [--version], required: true }
    - { id: fantomas, executable: fantomas, probe: [--version], required: true }
    - { id: csharpier, executable: csharpier, probe: [--version], required: true }
    - { id: ruff, executable: ruff, probe: [--version], required: true }
    - { id: mix, executable: mix, probe: [--version], required: true }
    - { id: dart, executable: dart, probe: [--version], required: true }
    - { id: shfmt, executable: shfmt, probe: [--version], required: true }
    - { id: tofu, executable: tofu, probe: [--version], required: true }
    - { id: clang-format, executable: clang-format, probe: [--version], required: true }
    - { id: shellcheck, executable: shellcheck, probe: [--version], required: true }
    - { id: hadolint, executable: hadolint, probe: [--version], required: true }
    - { id: actionlint, executable: actionlint, probe: [--version], required: true }

gates:
  composition:
    pull-request:
      relation: exact
  entries:
    - id: public-safety-tree
      type: check
      command:
        executable: bash
        args:
          - literal: scripts/public-safety/check.sh
      run-on:
        pre-commit: {}
        pre-push: {}
        pull-request: {}
    - id: public-safety-commit-message
      type: check
      inputs:
        message:
          kind: commit-message
      command:
        executable: ./scripts/public-safety/check-commit-message
        args:
          - input: message.text
            expand: single
      run-on:
        commit-msg:
          bind:
            message:
              source: hook-message-file
        pull-request:
          bind:
            message:
              source: explicit-range
              range: explicit
    - id: format-staged
      type: mutation
      inputs:
        staged:
          kind: files
      mutation:
        local: apply-index
        ci: verify-clean
      command:
        executable: ./scripts/format-staged
        args:
          - input: staged.paths
            expand: repeat
      run-on:
        pre-commit:
          bind:
            staged:
              source: git-index
        pull-request:
          bind:
            staged:
              source: explicit-range
              range: explicit
    - id: repo-config
      type: check
      command:
        executable: ./rhino
        args:
          - literal: repo-config
          - literal: validate
      run-on:
        pre-commit: {}
        pull-request: {}
    - id: harness-adapters
      type: check
      command:
        executable: ./rhino
        args:
          - literal: harness
          - literal: adapters
          - literal: validate
      run-on:
        pre-commit: {}
        pull-request: {}
    - id: governance-vendor
      type: check
      command:
        executable: ./rhino
        args:
          - literal: governance
          - literal: vendor
          - literal: validate
      run-on:
        pre-commit: {}
        pull-request: {}
    - id: env-validate
      type: check
      command:
        executable: ./rhino
        args:
          - literal: env
          - literal: validate
      run-on:
        pre-commit: {}
        pre-push: {}
        pull-request: {}
    - id: markdownlint
      type: check
      command:
        executable: npx
        args:
          - literal: --no
          - literal: markdownlint-cli2
          - literal: "**/*.md"
      run-on:
        pre-commit: {}
        pull-request: {}
    - id: md-mermaid
      type: check
      inputs:
        staged:
          kind: files
      command:
        executable: ./scripts/validate-mermaid-files
        args:
          - input: staged.paths
            expand: repeat
      run-on:
        pre-commit:
          bind:
            staged:
              source: git-index
        pull-request:
          bind:
            staged:
              source: explicit-range
              range: explicit
    # Every flowchart, graph, class, ER, and requirement diagram declares a palette classDef default
    # (repo-governance/conventions/formatting/diagrams/mermaid-color-accessibility-palette.md).
    - id: md-mermaid-palette
      type: check
      inputs:
        staged:
          kind: files
      command:
        executable: node
        args:
          - literal: scripts/validate-mermaid-palette.mjs
          - input: staged.paths
            expand: repeat
      run-on:
        pre-commit:
          bind:
            staged:
              source: git-index
        pull-request:
          bind:
            staged:
              source: explicit-range
              range: explicit
    - id: shellcheck
      type: check
      inputs:
        staged:
          kind: files
      command:
        executable: ./scripts/lint-shell
        args:
          - input: staged.paths
            expand: repeat
      run-on:
        pre-commit:
          bind:
            staged:
              source: git-index
        pull-request:
          bind:
            staged:
              source: explicit-range
              range: explicit
    - id: hadolint
      type: check
      inputs:
        staged:
          kind: files
      command:
        executable: ./scripts/lint-dockerfiles
        args:
          - input: staged.paths
            expand: repeat
      run-on:
        pre-commit:
          bind:
            staged:
              source: git-index
        pull-request:
          bind:
            staged:
              source: explicit-range
              range: explicit
    - id: actionlint
      type: check
      inputs:
        staged:
          kind: files
      command:
        executable: ./scripts/lint-workflows
        args:
          - input: staged.paths
            expand: repeat
      run-on:
        pre-commit:
          bind:
            staged:
              source: git-index
        pull-request:
          bind:
            staged:
              source: explicit-range
              range: explicit
    - id: md-heading-hierarchy
      type: check
      command:
        executable: ./rhino
        args:
          - literal: md
          - literal: heading-hierarchy
          - literal: validate
      run-on:
        pre-commit: {}
        pull-request: {}
    - id: md-naming
      type: check
      command:
        executable: ./rhino
        args:
          - literal: md
          - literal: naming
          - literal: validate
      run-on:
        pre-commit: {}
        pull-request: {}
    - id: md-frontmatter
      type: check
      command:
        executable: ./rhino
        args:
          - literal: md
          - literal: frontmatter
          - literal: validate
      run-on:
        pre-commit: {}
        pull-request: {}
    - id: convention-emoji
      type: check
      command:
        executable: ./rhino
        args:
          - literal: convention
          - literal: emoji
          - literal: validate
      run-on:
        pre-commit: {}
        pull-request: {}

