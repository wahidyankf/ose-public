# yaml-language-server: $schema=https://raw.githubusercontent.com/wahidyankf/rhino/v0.6.0/schemas/repo-config/v2.schema.json
# Repository-owned policy for the checksum-pinned Rhino candidate.
#
# The grouped document contains no legacy compatibility section. Each retained
# lifecycle check is declared below with a direct executable and typed arguments.

schema: rhino/repo-config/v2

repository: {}

scan:
  exclude-directories:
    - .git
    - node_modules
    - dist
    - build
    - target
    - .next
    - coverage
    - generated-reports
    - local-tmp
    - archived
    - apps-labs
    - worktrees
    - .terraform
    - generated-contracts
    - .nx
    - .fvm-cache
    - .playwright-mcp
    - .memsearch
    - deps
    - _build
    - cover
    - .venv
    - __pycache__
    - .pytest_cache
    - .ruff_cache
    - fixtures
    - raw
    - done

harness:
  canonical:
    agents:
      name: name
      description: description
      tier: tier
      grants: capabilities
      denials: denies
      constraints: constraints
    skills:
      name: name
      description: description
  requirements:
    capabilities:
      - repository-read
      - repository-write
      - shell
      - network
      - subagent
    constraints:
      - read-only
      - no-edit
      - no-glob
      - no-read
      - no-write
    routes:
      - canonical-import
    identities:
      - description
  profiles:
    - id: claude
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
          - network
          - subagent
        constraints:
          - read-only
          - no-edit
          - no-glob
          - no-read
          - no-write
        routes:
          - canonical-import
        identities:
          - description
      instruction-adapter:
        path: CLAUDE.md
        route: "@{path}"
      agent-adapter:
        path: ".claude/agents/{name}.md"
        format: front-matter
        route-field: body
        route: "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { name: name, description: description }
        lists: { skills: skills }
        tier-fields: { model: model, effort: effort }
        translations:
          - { when: always, field: tools, members: [Read] }
          - { when: requires, capability: repository-read, field: tools, members: [Glob, Grep] }
          - { when: requires, capability: repository-write, field: tools, members: [Write, Edit] }
          - { when: requires, capability: shell, field: tools, members: [Bash] }
          - { when: requires, capability: network, field: tools, members: [WebSearch, WebFetch] }
          - { when: requires, capability: subagent, field: tools, members: [Agent] }
          - { when: denies, capability: repository-write, field: tools, absent-members: [Write, Edit] }
          - { when: denies, capability: shell, field: tools, absent-members: [Bash, PowerShell] }
          - { when: constrains, capability: no-edit, field: tools, absent-members: [Edit] }
          - { when: constrains, capability: no-glob, field: tools, absent-members: [Glob] }
          - { when: constrains, capability: no-read, field: tools, absent-members: [Read] }
          - { when: constrains, capability: no-write, field: tools, absent-members: [Write] }
      skill-adapter:
        path: ".claude/skills/{name}/SKILL.md"
        format: front-matter
        route-field: body
        route: "Read {path} completely, resolve every relative resource from that skill directory, and follow it as authoritative before acting."
        identity: { name: name, description: description }
      tiers:
        plan: { model: opus, effort: high }
        execution: { model: sonnet, effort: xhigh }
        fast: { model: haiku, effort: xhigh }
    - id: codex
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
          - network
          - subagent
        constraints:
          - read-only
          - no-edit
          - no-glob
          - no-read
          - no-write
        routes:
          - canonical-import
        identities:
          - description
      agent-adapter:
        path: ".codex/agents/{name}.toml"
        format: toml
        route-field: developer_instructions
        route: "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { name: name, description: description }
        agents: [plan-checker, plan-execution-checker, plan-maker]
        absent: [model, effort]
    - id: opencode
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
          - network
          - subagent
        constraints:
          - read-only
          - no-edit
          - no-glob
          - no-read
          - no-write
        routes:
          - canonical-import
        identities:
          - description
      agent-adapter:
        path: ".opencode/agents/{name}.md"
        format: front-matter
        route-field: body
        route: "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { description: description }
        agents: [plan-checker, plan-execution-checker, plan-maker]
        fixed: { mode: subagent }
        translations:
          - { when: always, field: permission, entries: { read: allow } }
          - { when: requires, capability: repository-read, field: permission, entries: { glob: allow, grep: allow } }
          - { when: requires, capability: repository-write, field: permission, entries: { edit: allow } }
          - { when: requires, capability: shell, field: permission, entries: { bash: allow } }
          - { when: requires, capability: network, field: permission, entries: { webfetch: allow, websearch: allow } }
          - { when: denies, capability: repository-write, field: permission, entries: { edit: deny } }
          - { when: denies, capability: shell, field: permission, entries: { bash: deny } }

policies:
  markdown:
    metadata:
      surfaces:
        - glob: ".agents/agents/*.md"
          schema: agent
        - glob: ".agents/agents/README.md"
          schema: governance
        - glob: ".agents/skills/grill-me/SKILL.md"
          schema: skill
        - glob: ".agents/skills/plan-creating-project-plans/SKILL.md"
          schema: skill
        - glob: ".agents/skills/plan-grooming-idea-briefs/SKILL.md"
          schema: skill
        - glob: ".agents/skills/plan-writing-gherkin-criteria/SKILL.md"
          schema: skill
        - glob: ".agents/skills/plan-validating-quality/SKILL.md"
          schema: skill
        - glob: ".agents/skills/plan-verifying-execution/SKILL.md"
          schema: skill
    frontmatter:
      surfaces:
        - glob: "docs/explanation/software-engineering/**/*.md"
          require: [title, description, category, subcategory, tags]
          enum:
            category: [tutorial, how-to, reference, explanation, software]
          forbid: [updated]
        - glob: "repo-governance/**/*.md"
          require: [description, when_to_use]
          forbid: [updated, created]
        - glob: ".agents/agents/*.md"
          require: []
          forbid: [updated]
        - glob: ".agents/skills/**/*.md"
          require: []
          forbid: [updated]
        - glob: "plans/**/*.md"
          require: []
          forbid: [updated]
    heading-hierarchy:
      surfaces:
        - glob: "docs/**"
        - glob: "repo-governance/**"
        - glob: "specs/**"
        - glob: "plans/in-progress/**"
        - glob: "plans/backlog/**"
        - glob: "plans/ideas/**"
        - glob: "plans/README.md"
        - glob: "AGENTS.md"
        - glob: "CONTRIBUTING.md"
        - glob: "LICENSING-NOTICE.md"
        - glob: "README.md"
        - glob: "RTK.md"
        - glob: "SECURITY.md"
        - glob: "roadmap.md"
        - glob: "apps/ayokoding-www/README.md"
        - glob: "apps/ayokoding-www-be-e2e/README.md"
        - glob: "apps/ayokoding-www-fe-e2e/README.md"
        - glob: "apps/crane-cli/README.md"
        - glob: "apps/organiclever-app-web/README.md"
        - glob: "apps/organiclever-app-web-e2e/README.md"
        - glob: "apps/organiclever-be/README.md"
        - glob: "apps/organiclever-be-e2e/README.md"
        - glob: "apps/organiclever-www/README.md"
        - glob: "apps/organiclever-www-fe-e2e/README.md"
        - glob: "apps/ose-app-web/README.md"
        - glob: "apps/ose-app-web-e2e/README.md"
        - glob: "apps/ose-be/README.md"
        - glob: "apps/ose-be-e2e/README.md"
        - glob: "apps/ose-id-be/README.md"
        - glob: "apps/ose-id-be-e2e/README.md"
        - glob: "apps/ose-id-web/README.md"
        - glob: "apps/ose-id-web-e2e/README.md"
        - glob: "apps/ose-lms-be/README.md"
        - glob: "apps/ose-lms-be-e2e/README.md"
        - glob: "apps/ose-www/README.md"
        - glob: "apps/ose-www-be-e2e/README.md"
        - glob: "apps/ose-www-fe-e2e/README.md"
        - glob: "apps/roots-be/README.md"
        - glob: "apps/roots-be-e2e/README.md"
        - glob: "libs/fsharp-crane-core/README.md"
        - glob: "libs/fsharp-env-loader/README.md"
        - glob: "libs/ts-env-loader/README.md"
        - glob: "libs/web-ui/README.md"
        - glob: "libs/web-ui-token/README.md"
        - glob: "apps/ayokoding-www/docs/**"
      single-h1: true
      max-level-jump: 1
    internal-link:
      exclude-sources:
        - "plans/done/**"
        - "apps/ayokoding-www/content/**"
        - "apps/ose-www/content/**"
        - ".claude/skills/**"
        - ".agents/skills/**"
    mermaid:
      authoring-rule: rendered
      node-label-graphemes: 20
      edge-label-graphemes: 20
      fill-colors:
        - "#0173B2"
        - "#DE8F05"
        - "#029E73"
        - "#CC78BC"
        - "#CA9161"
        - "#808080"
        - "#000000"
        - "#FFFFFF"
      edge-colors:
        - "#0173B2"
        - "#DE8F05"
        - "#029E73"
        - "#CC78BC"
        - "#CA9161"
        - "#808080"
        - "#000000"
        - "#FFFFFF"
      text-colors:
        - "#0173B2"
        - "#DE8F05"
        - "#029E73"
        - "#CC78BC"
        - "#CA9161"
        - "#808080"
        - "#000000"
        - "#FFFFFF"
    naming:
      surfaces:
        - glob: "**/*.md"
          style: kebab-case
      exempt:
        - "**/README.md"
        - "**/SKILL.md"
        - "**/AGENTS.md"
        - "**/CLAUDE.md"
        - "**/_index.md"
        - "**/CONTRIBUTING.md"
        - "**/CHANGELOG.md"
        - "**/LICENSING-NOTICE.md"
        - "**/ROADMAP.md"
        - "**/SECURITY.md"
        - "**/*__linkedin__*.md"
        - "**/pull_request_template.md"
        - "**/RTK.md"
    readme-index:
      trees:
        - path: .agents/agents
        - path: .agents/skills
        - path: docs/explanation
        - path: docs/how-to
        - path: docs/reference
        - path: docs/tutorials
        - path: repo-governance
        - path: specs/apps/ayokoding
        - path: specs/apps/crane
        - path: specs/apps/ferret
        - path: specs/apps/organiclever
        - path: specs/apps/ose/app-web
        - path: specs/apps/ose/be
        - path: specs/apps/ose/id-be
        - path: specs/apps/ose/id-web
        - path: specs/apps/ose/lms-be
        - path: specs/apps/ose/www/behaviours/backend
        - path: specs/apps/ose/www/behaviours/frontend/app-shell
        - path: specs/apps/ose/www/behaviours/frontend/landing
        - path: specs/apps/roots
  governance:
    # Owner: repo-governance/conventions/structure/governance-vendor-independence.md.
    # The validator fails on any listed term found as a case-sensitive substring under `roots`.
    # The list holds names only; harness directory paths are deliberately absent. The convention
    # records why the branded-concept term is left to review instead of this list.
    vendor:
      roots: [repo-governance, AGENTS.md, CLAUDE.md]
      forbidden-terms:
        - "Claude Code"
        - "OpenCode"
        - "Cursor"
        - "Windsurf"
        - "Codeium"
        - "Copilot"
        - "Aider"
        - "Cline"
        - "Devin"
        - "Junie"
        - "JetBrains"
        - "Amazon Q"
        - "Antigravity"
        - "Pi Coding Agent"
        - "pi.dev"
        - "Earendil"
        - "Anthropic"
        - "OpenAI"
        - "xAI"
        - "Sonnet"
        - "Opus"
        - "Haiku"
        - "GPT"
        - "Gemini"
        - "DeepSeek"
        - "Qwen"
        - "Llama"
        - "Mistral"
        - "Grok"
      # Exceptions are limited to the convention's own term pages and Platform Binding Examples
      # pages; other governed files use neutral wording.
      vocabulary-exceptions:
        - term: "Claude Code"
