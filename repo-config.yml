# repo-config.yml — ose/repo-config/v2
#
# Unified repository configuration. The keys before `extensions:` are the v2
# core, read by the pinned Rust RHINO binary (`./rhino`): who may read this
# repository and which gates run at each surface. Everything under
# `extensions.rhino-cli` is this repository's own rhino-cli configuration,
# unchanged in meaning from schema v1; RHINO reads none of it, and rhino-cli
# reads only it.
#
# Core sections:
#   schema, visibility — the v2 schema identity; this repository is public
#   gates              — what RHINO dispatches at each surface: the public-safety
#                        screen first, then this repository's registry
#
# rhino-cli extension sections:
#   harness          — all-harness binding registry (§3.2); EVERY `harness` command reads this list
#   specs            — spec-tree structure config (specs:structure-validation)
#   governance-word-budget — per-surface instruction-file word budgets (rhino-cli governance word-budget validate)
#   env-contract     — surface registry for rhino-cli env validate (code↔config drift detection)
#   env-injection    — value-less injection manifest for rhino-cli env validate (manifest-consistency)
#   gate-surface-guards — optional whole-surface execution wrappers
#   gates            — declared quality-gate registry; every `gate` command (list/run/emit/validate) reads this list

schema: ose/repo-config/v2

# Public, and gated as public: the repository, its history and its Actions logs
# are readable by anyone, so the safety screen runs first on every surface.
visibility: public

# RHINO validator sections, read by the pinned ./rhino. rhino-cli reads only
# extensions.rhino-cli, so a split command's F# remainder never sees these.
# The one tier a canonical agent declares. It equals `model-grades.planning`, which the
# F# emitter already projects into every plan agent's Claude source.
model-tiers:
  claude:
    plan:
      model: opus
      effort: high

scan:
  exclude-directories:
    - .git
    - node_modules
    - dist
    - build
    - target
    - .next
    - coverage
    - generated-reports
    - local-tmp
    - archived
    - apps-labs
    - worktrees
    - .terraform
    - generated-contracts
    - .nx
    - .fvm-cache
    - deps
    - _build
    - cover
    - fixtures
    - raw
    # Archived plans are frozen history (plans/done/ is immutable, see
    # repo-governance/development/quality/markdown/archive-exclusion.md): an old
    # delivery checklist quoting the bare instruction import is not a live source.
    - done
harness-parity:
  canonical:
    instruction: AGENTS.md
    # Claude Code reads CLAUDE.md, which holds the one import directive and no
    # rule of its own, so the repository has one instruction body.
    instruction-adapter: CLAUDE.md
  # Empty on purpose. RHINO names an adapter by one path component after its
  # prefix, while this repository's agents live in family directories and its
  # .agents/skills tree is a byte mirror rather than a route. Agent and skill
  # parity stay with the rhino-cli harness validators (extensions.rhino-cli
  # delegation), and RHINO owns the instruction pair.
  harnesses: []
  prohibited-instruction-sources:
    - "**/AGENTS.md"
    - "**/AGENTS.override.md"
    - "**/CLAUDE.md"
    - ".claude/rules/**/*.md"
    - "**/GEMINI.md"
    - "**/.cursorrules"
    - "**/.windsurfrules"
    - ".github/copilot-instructions.md"
  # OpenCode reads always-on instructions from its settings file's
  # `instructions` key, so that key is a competing source in vendor syntax.
  prohibited-instruction-fields:
    - file: .opencode/opencode.json
      format: json
      field: instructions
  capabilities: []
  constraints: []

# Portable metadata covers only the plan-system rows the catalog defines: the canonical plan
# agents and the six planning skills' sources. Every other agent and skill keeps its
# Claude-native frontmatter, which the rhino-cli harness validators check.
metadata:
  surfaces:
    - glob: ".agents/agents/*.md"
      schema: agent
    # Declared after the agent glob so the directory index is read as governance, not as an agent.
    - glob: ".agents/agents/README.md"
      schema: governance
    - glob: ".claude/skills/grill-me/SKILL.md"
      schema: skill
    - glob: ".claude/skills/plan-creating-project-plans/SKILL.md"
      schema: skill
    - glob: ".claude/skills/plan-grooming-idea-briefs/SKILL.md"
      schema: skill
    - glob: ".claude/skills/plan-writing-gherkin-criteria/SKILL.md"
      schema: skill
    - glob: ".claude/skills/plan-validating-quality/SKILL.md"
      schema: skill
    - glob: ".claude/skills/plan-verifying-execution/SKILL.md"
      schema: skill

governance-word-budget:
  count: whitespace-separated
  surfaces:
    - { glob: "repo-governance/**/*.md", target: 650, warn: 750, fail: 750 }
    - { glob: ".claude/**/*.md", target: 650, warn: 750, fail: 750 }
    - { glob: ".codex/**/*.md", target: 650, warn: 750, fail: 750 }
    - { glob: ".opencode/**/*.md", target: 650, warn: 750, fail: 750 }
    - { glob: ".agents/**/*.md", target: 650, warn: 750, fail: 750 }
    - { glob: "AGENTS.md", target: 650, warn: 750, fail: 750 }
    - { glob: "CLAUDE.md", target: 650, warn: 750, fail: 750 }
    - { glob: "RTK.md", target: 650, warn: 750, fail: 750 }
    - { glob: "repo-governance/**/README.md", target: 900, warn: 1000, fail: 1000 }
    - { glob: ".claude/**/README.md", target: 900, warn: 1000, fail: 1000 }
    - { glob: ".codex/**/README.md", target: 900, warn: 1000, fail: 1000 }
    - { glob: ".opencode/**/README.md", target: 900, warn: 1000, fail: 1000 }
    - { glob: ".agents/**/README.md", target: 900, warn: 1000, fail: 1000 }
    - { glob: "apps/**/README.md", target: 900, warn: 1000, fail: 1000 }
    - { glob: "libs/**/README.md", target: 900, warn: 1000, fail: 1000 }
    - { glob: ".github/**/README.md", target: 900, warn: 1000, fail: 1000 }
    - { glob: "infra/**/README.md", target: 900, warn: 1000, fail: 1000 }
    - { glob: "scripts/README.md", target: 900, warn: 1000, fail: 1000 }
    - { glob: "social-media-posts/README.md", target: 900, warn: 1000, fail: 1000 }
    - { glob: "README.md", target: 900, warn: 1000, fail: 1000 }
md-frontmatter:
  surfaces:
    - glob: "docs/explanation/software-engineering/**/*.md"
      require: [title, description, category, subcategory, tags]
      enum:
        category: [tutorial, how-to, reference, explanation, software]
      forbid: [updated]
    - glob: "repo-governance/**/*.md"
      require: [description, when_to_use]
      forbid: [updated, created]
    # No date metadata in the remaining trees `md frontmatter-dates validate` covers.
    - glob: ".claude/agents/**/*.md"
      require: []
      forbid: [updated]
    - glob: ".claude/skills/**/*.md"
      require: []
      forbid: [updated]
    - glob: "plans/**/*.md"
      require: []
      forbid: [updated]
