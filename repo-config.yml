# yaml-language-server: $schema=https://raw.githubusercontent.com/wahidyankf/rhino/v0.4.0/schemas/repo-config/v2.schema.json
# Repository-owned policy for the checksum-pinned Rhino candidate.
#
# The grouped document contains no legacy compatibility section. Each retained
# lifecycle check is declared below with a direct executable and typed arguments.

schema: rhino/repo-config/v2

repository: {}

scan:
  exclude-directories:
    - .git
    - node_modules
    - dist
    - build
    - target
    - .next
    - coverage
    - generated-reports
    - local-tmp
    - archived
    - apps-labs
    - worktrees
    - .terraform
    - generated-contracts
    - .nx
    - .fvm-cache
    - .playwright-mcp
    - .memsearch
    - deps
    - _build
    - cover
    - .venv
    - __pycache__
    - .pytest_cache
    - .ruff_cache
    - fixtures
    - raw
    - done

harness:
  canonical:
    agents:
      name: name
      description: description
      tier: tier
      grants: capabilities
      denials: denies
      constraints: constraints
    skills:
      name: name
      description: description
  requirements:
    capabilities:
      - repository-read
      - repository-write
      - shell
      - network
    constraints:
      - read-only
    routes:
      - canonical-import
    identities:
      - description
  profiles:
    - id: claude
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
          - network
        constraints:
          - read-only
        routes:
          - canonical-import
        identities:
          - description
      instruction-adapter:
        path: CLAUDE.md
        route: "@{path}"
      agent-adapter:
        path: ".claude/agents/plan/{name}.md"
        format: front-matter
        route-field: body
        route: "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { name: name, description: description }
        tier-fields: { model: model, effort: effort }
        translations:
          - { when: always, field: tools, members: [Read] }
          - { when: requires, capability: repository-read, field: tools, members: [Glob, Grep] }
          - { when: requires, capability: repository-write, field: tools, members: [Write, Edit] }
          - { when: requires, capability: shell, field: tools, members: [Bash] }
          - { when: requires, capability: network, field: tools, members: [WebSearch, WebFetch] }
          - { when: denies, capability: repository-write, field: tools, absent-members: [Write, Edit] }
          - { when: denies, capability: shell, field: tools, absent-members: [Bash, PowerShell] }
      skill-adapter:
        path: ".claude/skills/{name}/SKILL.md"
        format: front-matter
        route-field: body
        route: "Read {path} completely, resolve every relative resource from that skill directory, and follow it as authoritative before acting."
        identity: { name: name, description: description }
      tiers:
        plan: { model: opus, effort: high }
    - id: codex
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
          - network
        constraints:
          - read-only
        routes:
          - canonical-import
        identities:
          - description
      agent-adapter:
        path: ".codex/agents/{name}.toml"
        format: toml
        route-field: developer_instructions
        route: "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { name: name, description: description }
        absent: [model, effort]
    - id: opencode
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
          - network
        constraints:
          - read-only
        routes:
          - canonical-import
        identities:
          - description
      agent-adapter:
        path: ".opencode/agents/{name}.md"
        format: front-matter
        route-field: body
        route: "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { description: description }
        fixed: { mode: subagent }
        translations:
          - { when: always, field: permission, entries: { read: allow } }
          - { when: requires, capability: repository-read, field: permission, entries: { glob: allow, grep: allow } }
          - { when: requires, capability: repository-write, field: permission, entries: { edit: allow } }
          - { when: requires, capability: shell, field: permission, entries: { bash: allow } }
          - { when: requires, capability: network, field: permission, entries: { webfetch: allow, websearch: allow } }
          - { when: denies, capability: repository-write, field: permission, entries: { edit: deny } }
          - { when: denies, capability: shell, field: permission, entries: { bash: deny } }

policies:
  markdown:
    metadata:
      surfaces:
        - glob: ".agents/agents/*.md"
          schema: agent
        - glob: ".agents/agents/README.md"
          schema: governance
        - glob: ".claude/skills/grill-me/SKILL.md"
          schema: skill
        - glob: ".claude/skills/plan-creating-project-plans/SKILL.md"
          schema: skill
        - glob: ".claude/skills/plan-grooming-idea-briefs/SKILL.md"
          schema: skill
        - glob: ".claude/skills/plan-writing-gherkin-criteria/SKILL.md"
          schema: skill
        - glob: ".claude/skills/plan-validating-quality/SKILL.md"
          schema: skill
        - glob: ".claude/skills/plan-verifying-execution/SKILL.md"
          schema: skill
    frontmatter:
      surfaces:
        - glob: "docs/explanation/software-engineering/**/*.md"
          require: [title, description, category, subcategory, tags]
          enum:
            category: [tutorial, how-to, reference, explanation, software]
          forbid: [updated]
        - glob: "repo-governance/**/*.md"
          require: [description, when_to_use]
          forbid: [updated, created]
        - glob: ".claude/agents/**/*.md"
          require: []
          forbid: [updated]
        - glob: ".claude/skills/**/*.md"
          require: []
          forbid: [updated]
        - glob: "plans/**/*.md"
          require: []
          forbid: [updated]
    heading-hierarchy:
      surfaces:
        - glob: "docs/**"
        - glob: "repo-governance/**"
        - glob: "specs/**"
        - glob: "plans/in-progress/**"
        - glob: "plans/backlog/**"
        - glob: "plans/ideas/**"
        - glob: "plans/README.md"
        - glob: "AGENTS.md"
        - glob: "CONTRIBUTING.md"
        - glob: "LICENSING-NOTICE.md"
        - glob: "README.md"
        - glob: "RTK.md"
        - glob: "SECURITY.md"
        - glob: "roadmap.md"
        - glob: "apps/ayokoding-www/README.md"
        - glob: "apps/ayokoding-www-be-e2e/README.md"
        - glob: "apps/ayokoding-www-fe-e2e/README.md"
        - glob: "apps/crane-cli/README.md"
        - glob: "apps/organiclever-app-web/README.md"
        - glob: "apps/organiclever-app-web-e2e/README.md"
        - glob: "apps/organiclever-be/README.md"
        - glob: "apps/organiclever-be-e2e/README.md"
        - glob: "apps/organiclever-www/README.md"
        - glob: "apps/organiclever-www-fe-e2e/README.md"
        - glob: "apps/ose-app-web/README.md"
        - glob: "apps/ose-app-web-e2e/README.md"
        - glob: "apps/ose-be/README.md"
        - glob: "apps/ose-be-e2e/README.md"
        - glob: "apps/ose-id-be/README.md"
        - glob: "apps/ose-id-be-e2e/README.md"
        - glob: "apps/ose-id-web/README.md"
        - glob: "apps/ose-id-web-e2e/README.md"
        - glob: "apps/ose-lms-be/README.md"
        - glob: "apps/ose-lms-be-e2e/README.md"
        - glob: "apps/ose-www/README.md"
        - glob: "apps/ose-www-be-e2e/README.md"
        - glob: "apps/ose-www-fe-e2e/README.md"
        - glob: "apps/roots-be/README.md"
        - glob: "apps/roots-be-e2e/README.md"
        - glob: "libs/fsharp-crane-core/README.md"
        - glob: "libs/fsharp-env-loader/README.md"
        - glob: "libs/ts-env-loader/README.md"
        - glob: "libs/web-ui/README.md"
        - glob: "libs/web-ui-token/README.md"
        - glob: "apps/ayokoding-www/docs/**"
      single-h1: true
      max-level-jump: 1
    internal-link:
      exclude-sources:
        - "plans/done/**"
        - "apps/ayokoding-www/content/**"
        - "apps/ose-www/content/**"
        - ".claude/skills/**"
        - ".agents/skills/**"
    mermaid:
      authoring-rule: rendered
      node-label-graphemes: 30
      edge-label-graphemes: 30
      fill-colors:
        - "#0173B2"
        - "#DE8F05"
        - "#029E73"
        - "#CC78BC"
        - "#CA9161"
        - "#808080"
        - "#000000"
        - "#FFFFFF"
      edge-colors:
        - "#0173B2"
        - "#DE8F05"
        - "#029E73"
        - "#CC78BC"
        - "#CA9161"
        - "#808080"
        - "#000000"
        - "#FFFFFF"
      text-colors:
        - "#0173B2"
        - "#DE8F05"
        - "#029E73"
        - "#CC78BC"
        - "#CA9161"
        - "#808080"
        - "#000000"
        - "#FFFFFF"
    naming:
      surfaces:
        - glob: "**/*.md"
          style: kebab-case
      exempt:
        - "**/README.md"
        - "**/SKILL.md"
        - "**/AGENTS.md"
        - "**/CLAUDE.md"
        - "**/_index.md"
        - "**/CONTRIBUTING.md"
        - "**/CHANGELOG.md"
        - "**/LICENSING-NOTICE.md"
        - "**/ROADMAP.md"
        - "**/SECURITY.md"
        - "**/*__linkedin__*.md"
        - "**/pull_request_template.md"
        - "**/RTK.md"
    readme-index:
      trees:
        - path: .claude/agents
        - path: .agents/skills
        - path: docs/explanation
        - path: docs/how-to
        - path: docs/reference
        - path: docs/tutorials
        - path: repo-governance
        - path: specs/apps/ayokoding
        - path: specs/apps/crane
        - path: specs/apps/ferret
        - path: specs/apps/organiclever
        - path: specs/apps/ose/app-web
        - path: specs/apps/ose/be
        - path: specs/apps/ose/id-be
        - path: specs/apps/ose/id-web
        - path: specs/apps/ose/lms-be
        - path: specs/apps/ose/www/behaviours/backend
        - path: specs/apps/ose/www/behaviours/frontend/app-shell
        - path: specs/apps/ose/www/behaviours/frontend/landing
        - path: specs/apps/roots
  governance:
    word-budget:
      count: whitespace-separated
      surfaces:
        - { glob: "repo-governance/**/*.md", target: 650, warn: 750, fail: 750 }
        - { glob: ".claude/**/*.md", target: 650, warn: 750, fail: 750 }
        - { glob: ".codex/**/*.md", target: 650, warn: 750, fail: 750 }
        - { glob: ".opencode/**/*.md", target: 650, warn: 750, fail: 750 }
        - { glob: ".agents/**/*.md", target: 650, warn: 750, fail: 750 }
        - { glob: "AGENTS.md", target: 650, warn: 750, fail: 750 }
        - { glob: "CLAUDE.md", target: 650, warn: 750, fail: 750 }
        - { glob: "RTK.md", target: 650, warn: 750, fail: 750 }
        - { glob: "repo-governance/**/README.md", target: 900, warn: 1000, fail: 1000 }
        - { glob: ".claude/**/README.md", target: 900, warn: 1000, fail: 1000 }
        - { glob: ".codex/**/README.md", target: 900, warn: 1000, fail: 1000 }
        - { glob: ".opencode/**/README.md", target: 900, warn: 1000, fail: 1000 }
        - { glob: ".agents/**/README.md", target: 900, warn: 1000, fail: 1000 }
        - { glob: "apps/**/README.md", target: 900, warn: 1000, fail: 1000 }
        - { glob: "libs/**/README.md", target: 900, warn: 1000, fail: 1000 }
        - { glob: ".github/**/README.md", target: 900, warn: 1000, fail: 1000 }
        - { glob: "infra/**/README.md", target: 900, warn: 1000, fail: 1000 }
        - { glob: "scripts/README.md", target: 900, warn: 1000, fail: 1000 }
        - { glob: "social-media-posts/README.md", target: 900, warn: 1000, fail: 1000 }
        - { glob: "README.md", target: 900, warn: 1000, fail: 1000 }
  conventions:
    emoji:
      prohibited:
        - glob: "**/*.json"
        - glob: "**/*.yaml"
        - glob: "**/*.yml"
        - glob: "**/*.toml"
        - glob: "**/*.go"
        - glob: "**/*.ts"
        - glob: "**/*.tsx"
        - glob: "**/*.js"
        - glob: "**/*.jsx"
        - glob: "**/*.py"
        - glob: "**/*.java"
        - glob: "**/*.kt"
        - glob: "**/*.rs"
        - glob: "**/*.fs"
        - glob: "**/*.cs"
        - glob: "**/*.dart"
        - glob: "**/*.exs"
        - glob: "**/*.ex"
        - glob: "**/*.clj"

environment:
  examples:
    - { source: apps/ayokoding-www/.env.example, target: apps/ayokoding-www/.env.local }
    - { source: apps/organiclever-app-web/.env.example, target: apps/organiclever-app-web/.env.local }
    - { source: apps/organiclever-be/.env.example, target: apps/organiclever-be/.env.local }
    - { source: apps/organiclever-www/.env.example, target: apps/organiclever-www/.env.local }
    - { source: apps/ose-app-web/.env.example, target: apps/ose-app-web/.env.local }
    - { source: apps/ose-be/.env.example, target: apps/ose-be/.env.local }
    - { source: apps/ose-id-be/.env.example, target: apps/ose-id-be/.env.local }
    - { source: apps/ose-id-web/.env.example, target: apps/ose-id-web/.env.local }
    - { source: apps/ose-lms-be/.env.example, target: apps/ose-lms-be/.env.local }
    - { source: apps/ose-www/.env.example, target: apps/ose-www/.env.local }
    - { source: apps/roots-be/.env.example, target: apps/roots-be/.env.local }
  staged:
    forbidden: [".env*", "**/.env*"]
    allowed:
      - apps/ayokoding-www/.env.example
      - apps/ayokoding-www/content/en/learn/courses/cicd-and-release-engineering/.env.example
      - apps/ayokoding-www/content/en/learn/courses/containers-and-orchestration/learning/capstone/.env.example
      - apps/ayokoding-www/content/en/learn/courses/containers-and-orchestration/learning/code/ex-34-compose-db-cache/.env.example
      - apps/organiclever-app-web/.env.example
      - apps/organiclever-be/.env.example
      - apps/organiclever-www/.env.example
      - apps/ose-app-web/.env.example
      - apps/ose-be/.env.example
      - apps/ose-id-be/.env.example
      - apps/ose-id-web/.env.example
      - apps/ose-lms-be/.env.example
      - apps/ose-www/.env.example
      - apps/roots-be/.env.example
  contracts:
    - path: apps/ayokoding-www/.env.example
      keys: [AYOKODING_WEB_CONTENT_DIR, AYOKODING_WEB_SHOW_DRAFTS, AYOKODING_WEB_MANIFESTS_DIR]
    - path: apps/organiclever-app-web/.env.example
      keys: [ORGANICLEVER_BE_URL]
    - path: apps/ose-id-web/.env.example
      keys: [OSE_RUNTIME_MODE, OSE_ID_WEB_PORT, OSE_ID_BE_URL]
    - path: apps/ose-www/.env.example
      keys: [OSE_WEB_CONTENT_DIR, OSE_WEB_SEARCH_DATA_PATH, OSE_WEB_SHOW_DRAFTS]
    - path: apps/roots-be/.env.example
      keys: [ROOTS_BE_PORT]
  detectors:
    - language: type-script
      paths:
        - apps/ayokoding-www/src/env.ts
        - apps/organiclever-app-web/src/env.ts
        - apps/ose-id-web/src/env.ts
        - apps/ose-www/src/env.ts
    - language: go
      paths: [apps/roots-be/cmd/roots-be/main.go]

toolchains:
  entries:
    - { id: git, executable: git, probe: [--version], required: true }
    - { id: volta, executable: volta, probe: [--version], required: true }
    - { id: node, executable: node, probe: [--version], required: true }
    - { id: npm, executable: npm, probe: [--version], required: true }
    - { id: dotnet, executable: dotnet, probe: [--version], required: true }
    - { id: go, executable: go, probe: [version], required: true }
    - { id: golangci-lint, executable: golangci-lint, probe: [version], required: true }
    - { id: java, executable: java, probe: [--version], required: true }
    - { id: docker, executable: docker, probe: [--version], required: true }
    - { id: jq, executable: jq, probe: [--version], required: true }

gates:
  composition:
    pull-request:
      relation: exact
  entries:
    - id: public-safety-tree
      type: check
      command:
        executable: bash
        args:
          - literal: scripts/public-safety/check.sh
      run-on:
        pre-commit: {}
        pre-push: {}
        pull-request: {}
    - id: public-safety-commit-message
      type: check
      inputs:
        message:
          kind: commit-message
      command:
        executable: ./scripts/public-safety/check-commit-message
        args:
          - input: message.text
            expand: single
      run-on:
        commit-msg:
          bind:
            message:
              source: hook-message-file
        pull-request:
          bind:
            message:
              source: explicit-range
              range: explicit
    - id: format-staged
      type: mutation
      inputs:
        staged:
          kind: files
      mutation:
        local: apply-index
        ci: verify-clean
      command:
        executable: ./scripts/format-staged
        args:
          - input: staged.paths
            expand: repeat
      run-on:
        pre-commit:
          bind:
            staged:
              source: git-index
        pull-request:
          bind:
            staged:
              source: explicit-range
              range: explicit
    - id: repo-config
      type: check
      command:
        executable: ./rhino
        args:
          - literal: repo-config
          - literal: validate
      run-on:
        pre-commit: {}
        pull-request: {}
    - id: env-validate
      type: check
      command:
        executable: ./rhino
        args:
          - literal: env
          - literal: validate
      run-on:
        pre-commit: {}
        pre-push: {}
        pull-request: {}
    - id: markdownlint
      type: check
      command:
        executable: npx
        args:
          - literal: --no
          - literal: markdownlint-cli2
          - literal: "**/*.md"
      run-on:
        pre-commit: {}
        pull-request: {}
    - id: md-mermaid
      type: check
      inputs:
        staged:
          kind: files
      command:
        executable: ./scripts/validate-mermaid-files
        args:
          - input: staged.paths
            expand: repeat
      run-on:
        pre-commit:
          bind:
            staged:
              source: git-index
        pull-request:
          bind:
            staged:
              source: explicit-range
              range: explicit
    - id: md-heading-hierarchy
      type: check
      command:
        executable: ./rhino
        args:
          - literal: md
          - literal: heading-hierarchy
          - literal: validate
      run-on:
        pre-commit: {}
        pull-request: {}
    - id: md-naming
      type: check
      command:
        executable: ./rhino
        args:
          - literal: md
          - literal: naming
          - literal: validate
      run-on:
        pre-commit: {}
        pull-request: {}
    - id: md-frontmatter
      type: check
      command:
        executable: ./rhino
        args:
          - literal: md
          - literal: frontmatter
          - literal: validate
      run-on:
        pre-commit: {}
        pull-request: {}
    - id: convention-emoji
      type: check
      command:
        executable: ./rhino
        args:
          - literal: convention
          - literal: emoji
          - literal: validate
      run-on:
        pre-commit: {}
        pull-request: {}
